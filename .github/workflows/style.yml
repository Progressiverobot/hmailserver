name: Coding style

# Automatically enforces the project's selected coding style, which is
# declared in .editorconfig (C++/C#: spaces, width 3).
#
# editorconfig-checker validates every text file against .editorconfig
# (indentation style, trailing whitespace, final newline).
#
# Style exceptions live in .editorconfig-checker.json and .editorconfig, in the
# repository, where they are visible and reviewable — not in anyone's local
# settings.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorconfig:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checker's version is pinned as well as the action's. The action
      # defaults to "latest" and downloads the release asset named
      # ec-linux-amd64*; editorconfig-checker 4.0.0 (3 September 2026) renamed
      # its assets to editorconfig-checker-linux-amd64*, so from that day
      # every run - master included - failed in the download step with "The
      # binary 'ec-linux-amd64*' not found" before checking a single file.
      # 3.11.3 is the last release that still ships the old name. Bump this
      # together with the action, once an action release understands 4.x.
      #
      # The action only INSTALLS the checker (it downloads the release, renames
      # the binary to editorconfig-checker and puts it on PATH); it never runs
      # it. From the day this job was written until 4 September 2026 every run
      # was green without a single file having been checked. The run step
      # below is the check. It reads .editorconfig-checker.json at the repository
      # root, which says what is excluded and why.
      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.11.3

      - name: Check files against .editorconfig
        run: editorconfig-checker

  license-headers:
    name: SPDX identifier on every source file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same script that puts the headers there, in its report-only mode: a
      # file whose header is missing, or differs from the one form, fails here
      # with its name, and the fix is the script's other mode. Generated MIDL
      # output and the third-party sources are excluded inside the script, with
      # the reasons.
      - name: Every source file opens with the project header
        run: python3 build/add-license-headers.py --check

      # Every static caption in the Control Panel carries an Alt-key mnemonic and
      # no two that can be on screen together share one. Half a set is worse than
      # none, so a new button without one fails here with its file and line.
      - name: Every Control Panel caption carries an Alt-key mnemonic
        run: python3 build/check-mnemonics.py

      # The Control Panel's translation catalogues: the English one is generated
      # from the L(...) / {loc:L} marks in the source and must be committed up to
      # date, every language keeps the placeholders and Alt keys of its English,
      # and a file listed as localised carries no unmarked caption.
      - name: The Control Panel's translation catalogues match the source
        run: python3 build/check-localisation.py

      # What a per-string check cannot see: the English a caption must keep
      # because the server writes it that way (its own log stage names, INI and
      # setting names, INBOX, the syntax a user types back), a page named in
      # prose by something other than that page's own translated title, and a
      # number the translation dropped.
      - name: The catalogues keep the server's own words, the numbers and the page names
        run: python3 build/check-catalogues.py

      # A setting an administrator can only reach by opening a text file on the
      # server is one the Control Panel does not have. This reads the keys out of
      # IniFileSettings and fails when one of them is named nowhere in the Control
      # Panel - which is how the live update's five trust settings were found
      # missing after the feature had shipped.
      - name: Every INI setting can be set from the Control Panel
        run: python3 build/check-ini-coverage.py
      - name: Every statement in a MySQL script ends with a blank line
        run: python3 build/check-sql-separators.py

      # A table that holds one account's data and is in neither the backup nor
      # the list of what is carried elsewhere is data a RESTORE destroys: every
      # one of them cascades from hm_accounts and a restore deletes every domain
      # first. Seven such tables were added between 6.3.0 and 6.3.3 and not one
      # reached the archive. This reads the CREATE TABLE scripts against
      # AccountStores.cpp and fails by name, with what to do.
      - name: Every per-account table is in the backup, or says why not
        run: python3 build/check-account-stores.py

      # "May account A do X to folder F" is answered by ACLManager and nowhere else;
      # a second decision-maker is how mail servers serve other people's mail.
      - name: Every folder-access decision is ACLManager's
        run: python3 build/check-authz-choke-point.py

      # The portal's page and its script are C++ string literals, and what stood
      # behind them was a test asserting that certain substrings appeared - which
      # proves a name is spelled somewhere and nothing about what the page does.
      # This extracts both literals and RUNS the script against a small DOM and a
      # stubbed API: the sign-in that stores no password, the listing, the
      # keyboard cursor, the inline image that never points at a URL, the change
      # probe that stops while the tab is hidden.
      - name: The self-service portal's script does what the page needs
        run: python3 build/check-portal-script.py

      # The Control Deck is one file - markup, a style block and one inline
      # script - and the only graphical administration a Linux server has.
      # This lifts the script out, checks the markup against the policy the
      # server sends for the page (read from RestApiServer.cpp, so the two
      # cannot drift apart) and RUNS the script against a small DOM and a
      # recorded server: each view drawn from its answers, each form sending
      # the JSON its route takes, each refusal shown in the server's words,
      # each change read back after the round trip.
      - name: The Control Deck's script does what the page needs
        run: python3 build/check-deck-script.py

      # The two command-line clients are the REST API with a vocabulary in front
      # of it, so what can go wrong is the vocabulary pointing at the wrong
      # route - and a check that needs a running server is a check nobody runs.
      # This stands a recorded server in front of both and asserts the method,
      # the path, the Authorization header and the body of every request each
      # one makes, so hmctl and the PowerShell module cannot drift apart or
      # drift away from the API.
      - name: hmctl and the PowerShell module ask for what the API answers
        run: python3 build/check-cli.py

      # Every language's catalogue has every text the page has and nothing
      # else, keeps the tokens a reader types verbatim, and the embedded unit
      # is what the generator writes now.
      - name: The self-service portal's catalogues match the page
        run: python3 build/check-portal-languages.py

      # The Control Deck's catalogues, likewise: every language has every text
      # the page has and nothing else, keeps the tokens and the server's own
      # words, carries nothing HTML would read (the page inserts a translation
      # unescaped, where the English stood), and is in the catalogues' form.
      - name: The Control Deck's catalogues match the page
        run: python3 build/check-deck-languages.py
      # The parity census: every property the desktop Control Panel writes, whether
      # the REST API can write it and whether a Deck view reaches it. The document is
      # generated and committed so a reader sees the gap without running anything;
      # this regenerates it and fails when the committed copy is behind, the way
      # ci.yml holds the settings index. The script produces the same bytes on Linux
      # as on Windows (checked on 15 September 2026).
      - name: The parity census in docs/DeckParity.md is current
        run: |
          python3 build/check-deck-parity.py > /dev/null
          if ! git diff --quiet -- hmailserver/docs/DeckParity.md; then
            git --no-pager diff -- hmailserver/docs/DeckParity.md | head -80
            echo "::error file=hmailserver/docs/DeckParity.md::Out of date. Run python build/check-deck-parity.py and commit the result."
            exit 1
          fi
      - name: The webmail's S/MIME module, against OpenSSL both ways
        run: node build/check-portal-smime.js
      - name: The S/MIME module embedded in the server is current
        run: python3 build/generate-portal-smime.py --check
      - name: The webmail's page embedded in the server is current
        run: python3 build/generate-portal-page.py --check

  dotnet-format:
    name: dotnet format leaves the C# tree unchanged
    # Written on 21 August 2026 and taken out of the same commit, because the
    # tree was not clean and a red check on every push would have trained
    # everyone to ignore it. The tree was brought to clean on 4 September
    # 2026 (issue #44) as a formatting-only commit; this keeps it there. The
    # two targets are the ones the issue measured: the setup and migration
    # tools' solution and the Control Panel project. Formatting only -
    # whitespace and using-directive order under .editorconfig - which is
    # why the check needs no build of its own beyond the restore dotnet
    # format performs itself.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: The setup and migration tools
        run: dotnet format "hmailserver/source/Tools/hMailServer Tools.sln" --verify-no-changes

      - name: The Control Panel
        run: dotnet format hmailserver/source/Tools/ControlPanel/ControlPanel.csproj --verify-no-changes
