name: SBOM

# Generates a Software Bill of Materials for the repository on every push to
# master and attaches it to every GitHub release, so each shipped build has an
# auditable inventory of its components.
#
# ATTACHED WHILE THE RELEASE IS STILL A DRAFT, and that is not a style choice.
# This repository has immutable releases enabled, so a published release refuses
# every further asset upload with HTTP 422 - which is what happened to 6.2.22-pre4
# and left it with an installer and no SBOM at all. A draft is still mutable, so
# the assets go on before publication and the release is complete the moment it
# becomes visible.
#
# Saving a draft does NOT start this workflow - GitHub delivers no release event for
# draft releases - so the release procedure dispatches it by hand with release_tag.
# The trigger below only catches a release published without a draft first, which is
# the case that can no longer attach anything, and the warning in the upload step
# says so. Syft (anchore/sbom-action)
# inventories the .NET package references and the files in the tree; the SBOM is
# emitted in both SPDX and CycloneDX JSON. Combined with Dependabot + the
# dependency-review gate, this delivers the B8 "SBOM + dependency/CVE scanning"
# supply-chain requirement.

on:
  push:
    branches: [ master ]
  release:
    # created, not published: it fires when a draft is saved, which is while the
    # release can still be added to.
    types: [ created ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the SBOMs to (e.g. v6.2.22-pre5). Leave blank to build them as an artifact only.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      # Required so the SBOM can be attached as an asset on release events.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Syft writes to a file and does NOT upload here. Both uploads happen further down,
      # after the native dependencies have been added - otherwise the artifact and the
      # release asset are the incomplete SBOM this workflow used to publish.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: hmailserver.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: hmailserver.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # The step this workflow was missing. Syft reports what is in the repository, and
      # OpenSSL, Boost and libpq are not: they are built separately and reached through
      # $(hMailServerLibs). The published SBOM therefore listed 54 packages, every one of
      # them .NET, for a mail server whose TLS is OpenSSL and whose entire socket layer is
      # Boost Asio - so anyone checking a release against a CVE feed, which is the whole
      # purpose of shipping an SBOM, would have concluded this server does not link
      # OpenSSL. Versions come from the include paths in hMailServer.vcxproj, which is what
      # the compiler is actually given and so cannot be stale while the build works.
      - name: Add the native dependencies Syft cannot see
        shell: pwsh
        run: |
          ./build/merge-native-dependencies-into-sbom.ps1 -SbomFile hmailserver.spdx.json
          ./build/merge-native-dependencies-into-sbom.ps1 -SbomFile hmailserver.cyclonedx.json

      # Fails the job rather than shipping a silently incomplete SBOM. The whole defect
      # this workflow just fixed was an absence nobody noticed, so the absence is now
      # something CI notices.
      - name: Verify both SBOMs name every native dependency
        shell: pwsh
        run: |
          $expected = (./build/native-dependencies.ps1 | ConvertFrom-Json)
          $failed = $false
          foreach ($file in @('hmailserver.spdx.json', 'hmailserver.cyclonedx.json')) {
            $content = Get-Content $file -Raw
            foreach ($dependency in $expected) {
              if ($content -notmatch [regex]::Escape($dependency.purl)) {
                Write-Host "::error file=$file::$file does not list $($dependency.purl)"
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Both SBOMs list all $($expected.Count) native dependencies."

      - name: Upload the SBOMs as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            hmailserver.spdx.json
            hmailserver.cyclonedx.json
          retention-days: 90

      - name: Attach the SBOMs to the release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # A published release rejects this outright - immutable releases are on -
          # so say which mistake was made rather than leaving a bare 422. The fix is
          # always the same: attach assets while the release is a draft.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::warning::$TAG is already published, so its assets cannot be changed. Create the release as a draft, let this workflow and sign-release attach to it, and publish last - see RELEASE.md."
          fi

          gh release upload "$TAG" \
            hmailserver.spdx.json hmailserver.cyclonedx.json --clobber
