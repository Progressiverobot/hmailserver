name: Upstream watch

# Keeps the fork honest about how far it has drifted from the original
# hMailServer source. Upstream is largely dormant, but it is not dead - PR #530
# (a real DKIM signing fix) landed there and was ported into 6.2.15 only because
# a forum regular pointed it out. This job makes that a scheduled check instead of
# a lucky catch: once a month it lists the commits on the upstream default branch
# that this fork does not contain, and records them in a tracking issue.
#
# It never merges or changes code. Its whole output is a human-readable list for
# the maintainer to triage.

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/name) to compare against.'
        type: string
        default: 'hmailserver/hmailserver'
      since_days:
        description: 'Only report upstream commits from the last N days (0 = all not in this fork).'
        type: string
        default: '0'

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: List upstream commits not in this fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream and compute the gap
        id: gap
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream_repo || 'hmailserver/hmailserver' }}
          SINCE_DAYS: ${{ inputs.since_days || '0' }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true

          # The upstream default branch is not assumed to be named "master"; ask.
          up_default=$(git remote show upstream | sed -n 's/.*HEAD branch: //p' | head -1)
          up_default=${up_default:-master}
          echo "Upstream default branch: ${up_default}"
          git fetch --no-tags --quiet upstream "${up_default}"

          # Commits reachable from upstream but not from this fork's HEAD, matched
          # by patch-id where possible so cherry-picked ports are not re-reported.
          if [ "${SINCE_DAYS}" != "0" ]; then
            since_arg="--since=${SINCE_DAYS}.days.ago"
          else
            since_arg=""
          fi

          # shellcheck disable=SC2086
          git cherry -v HEAD "upstream/${up_default}" 2>/dev/null \
            | grep '^+' \
            | sed 's/^+ //' > all_missing.txt || true

          if [ -n "${since_arg}" ]; then
            : > missing.txt
            while read -r sha rest; do
              [ -z "${sha}" ] && continue
              if git merge-base --is-ancestor "${sha}" "upstream/${up_default}" 2>/dev/null; then
                if git log -1 ${since_arg} --format='%H' "${sha}" 2>/dev/null | grep -q .; then
                  echo "${sha} ${rest}" >> missing.txt
                fi
              fi
            done < all_missing.txt
          else
            cp all_missing.txt missing.txt
          fi

          count=$(wc -l < missing.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "branch=${up_default}" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "Automated monthly comparison against \`${UPSTREAM}\` (branch \`${up_default}\`)."
            echo ""
            if [ "${count}" = "0" ]; then
              echo "No upstream commits are missing from this fork (by patch-id). Nothing to triage."
            else
              echo "**${count}** upstream commit(s) are not present in this fork (matched by patch-id, so clean cherry-picks are excluded):"
              echo ""
              echo '```'
              cat missing.txt
              echo '```'
              echo ""
              echo "Triage each: port it, or record here why it does not apply to the fork (superseded, Windows-specific, already covered by a fork extension)."
            fi
            echo ""
            echo "_Generated by the Upstream watch workflow._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: ${{ steps.gap.outputs.count != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.gap.outputs.body }}
          UPSTREAM: ${{ steps.gap.outputs.upstream }}
        run: |
          set -euo pipefail
          title="Upstream drift: commits in ${UPSTREAM} not yet in this fork"
          existing=$(gh issue list --state open --search "in:title Upstream drift" --json number,title \
            --jq ".[] | select(.title==\"${title}\") | .number" | head -1)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${BODY}"
            echo "Updated tracking issue #${existing}."
          else
            gh issue create --title "${title}" --label upstream --body "${BODY}"
            echo "Opened a new tracking issue."
          fi

      - name: Report a clean result
        if: ${{ steps.gap.outputs.count == '0' }}
        run: echo "No upstream drift - this fork contains every upstream commit (by patch-id)."
