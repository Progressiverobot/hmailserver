name: Upstream watch

# Keeps the fork honest about how far it has drifted from the original
# hMailServer source. Upstream is largely dormant, but it is not dead - PR #530
# (a real DKIM signing fix) landed there and was ported into 6.2.15 only because
# a forum regular pointed it out. This job makes that a scheduled check instead of
# a lucky catch: once a month it lists the commits on the upstream default branch
# that have landed since the commit recorded in .github/upstream-sync, and
# records them in a tracking issue for triage.
#
# It never merges or changes code. Its whole output is a human-readable list for
# the maintainer to triage.

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/name) to compare against.'
        type: string
        default: 'hmailserver/hmailserver'
      since_days:
        description: 'Only report upstream commits from the last N days (0 = all not in this fork).'
        type: string
        default: '0'

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: List upstream commits not in this fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream and compute the gap
        id: gap
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream_repo || 'hmailserver/hmailserver' }}
          SINCE_DAYS: ${{ inputs.since_days || '0' }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true

          # The upstream default branch is not assumed to be named "master"; ask.
          up_default=$(git remote show upstream | sed -n 's/.*HEAD branch: //p' | head -1)
          up_default=${up_default:-master}
          echo "Upstream default branch: ${up_default}"
          git fetch --no-tags --quiet upstream "${up_default}"

          # This fork's history is squashed and disjoint from upstream's, so
          # `git cherry` / patch-id matching reports every upstream commit ever
          # made as "missing" - including "First commit" - which is noise, not
          # signal. Instead report only what has landed upstream since the commit
          # recorded in .github/upstream-sync, which the maintainer advances as
          # each batch is triaged.
          sync_file=".github/upstream-sync"
          baseline=""
          if [ -f "${sync_file}" ]; then
            baseline=$(grep -vE '^\s*#' "${sync_file}" | grep -oE '[0-9a-f]{40}' | head -1)
          fi

          if [ -z "${baseline}" ]; then
            echo "No baseline in ${sync_file}; reporting the 20 most recent upstream commits."
            git log --format='%H %s' -20 "upstream/${up_default}" > missing.txt
            seeded="no"
          elif ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            echo "Baseline ${baseline} is not a commit in upstream; reporting the 20 most recent."
            git log --format='%H %s' -20 "upstream/${up_default}" > missing.txt
            seeded="stale"
          else
            git log --format='%H %s' "${baseline}..upstream/${up_default}" > missing.txt
            seeded="yes"
          fi

          if [ "${SINCE_DAYS}" != "0" ] && [ -s missing.txt ]; then
            cutoff=$(date -u -d "${SINCE_DAYS} days ago" +%s)
            : > filtered.txt
            while read -r sha rest; do
              [ -z "${sha}" ] && continue
              ts=$(git log -1 --format='%ct' "${sha}" 2>/dev/null || echo 0)
              if [ "${ts}" -ge "${cutoff}" ]; then echo "${sha} ${rest}" >> filtered.txt; fi
            done < missing.txt
            mv filtered.txt missing.txt
          fi

          echo "baseline=${baseline:-none} (${seeded})"

          count=$(wc -l < missing.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "branch=${up_default}" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "Automated monthly comparison against \`${UPSTREAM}\` (branch \`${up_default}\`)."
            echo ""
            if [ "${count}" = "0" ]; then
              echo "Nothing new upstream since the recorded sync point. Nothing to triage."
            else
              echo "**${count}** upstream commit(s) have landed since the sync point recorded in \`.github/upstream-sync\`:"
              echo ""
              echo '```'
              cat missing.txt
              echo '```'
              echo ""
              echo "Triage each: port it, or record why it does not apply (superseded, Windows-specific, already covered by a fork extension). Then advance the SHA in \`.github/upstream-sync\` so the next run starts from here."
            fi
            echo ""
            echo "_Generated by the Upstream watch workflow._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: ${{ steps.gap.outputs.count != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.gap.outputs.body }}
          UPSTREAM: ${{ steps.gap.outputs.upstream }}
        run: |
          set -euo pipefail
          title="Upstream drift: commits in ${UPSTREAM} not yet in this fork"
          existing=$(gh issue list --state open --search "in:title Upstream drift" --json number,title \
            --jq ".[] | select(.title==\"${title}\") | .number" | head -1)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${BODY}"
            echo "Updated tracking issue #${existing}."
          else
            # The label is decoration; the list of un-triaged upstream commits is the
            # entire point of this workflow. So the issue is created WITHOUT the label
            # and labelled afterwards on a best-effort basis.
            #
            # It is written this way because the other way round lost a whole report.
            # The first run of this workflow computed all 21 missing commits correctly
            # and then died on its last line with "could not add label: 'upstream' not
            # found": label creation was attempted as `... 2>/dev/null || true`, which
            # discarded the reason it failed, and then `gh issue create --label upstream`
            # was allowed to depend on it anyway. Under `set -e` that took the run to
            # exit 1 with no issue and no comment - the fork silently stopped watching
            # upstream, and the only evidence was a red tick on a scheduled workflow
            # nobody was watching either.
            #
            # Two rules come out of that and both are load-bearing here. Never suppress
            # the error from a command whose success you then rely on. And never let a
            # cosmetic step fail a job that has already produced the valuable thing.
            if ! gh label create upstream --description "Upstream drift tracking" --color ededed; then
              echo "Note: could not create the 'upstream' label (it may already exist)."
            fi

            number=$(gh issue create --title "${title}" --body "${BODY}" \
              | grep -oE '[0-9]+$' | tail -1)
            echo "Opened tracking issue #${number:-(number not parsed)}."

            if [ -n "${number}" ]; then
              gh issue edit "${number}" --add-label upstream \
                || echo "Note: issue #${number} was opened but could not be labelled."
            fi
          fi

      - name: Report a clean result
        if: ${{ steps.gap.outputs.count == '0' }}
        run: echo "No upstream drift since the recorded sync point."
