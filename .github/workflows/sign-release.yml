name: Sign release artefacts

# Signs every asset attached to a release with Sigstore cosign, keyless, and
# attaches the signature and certificate bundle alongside it.
#
# RUN THIS WHILE THE RELEASE IS STILL A DRAFT, and run it LAST. Immutable releases
# are enabled here, so a published release refuses further uploads; and this signs
# whatever is attached at the moment it runs, so it has to go after the SBOMs or it
# signs the installer and nothing else. RELEASE.md has the order.
#
# Why: the roadmap records signing as the one genuinely missing supply-chain item.
# SBOMs (SPDX + CycloneDX) already ship with every release, CodeQL and dependency
# review run in CI, and Dependabot is on - but an installer downloaded from the
# releases page carries nothing a user can verify it against. That matters more for
# a mail server than for most software: it runs as a service, with database
# credentials, and it is the kind of thing an attacker would like to substitute.
#
# Keyless deliberately. The alternative is a long-lived signing key, which for a
# single-maintainer project means a secret in GitHub Actions that is itself the
# thing most worth stealing. Keyless signing binds the signature to this
# repository's workflow identity via OIDC, records it in the public Rekor
# transparency log, and leaves no key to leak or rotate.
#
# This does NOT replace Authenticode. Windows SmartScreen and the UAC prompt care
# about Authenticode, not Sigstore, and that needs a certificate this project does
# not currently have (Azure Trusted Signing is the realistic route). Cosign gives
# verifiability today, for anyone who checks; Authenticode remains open on the
# roadmap and the two are complementary, not alternatives.
#
# Verify a downloaded installer with:
#
#   cosign verify-blob \
#     --bundle hMailServer-x.y.z-x64.exe.cosign.bundle \
#     --certificate-identity-regexp '^https://github\.com/Progressiverobot/hmailserver/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     hMailServer-x.y.z-x64.exe

on:
  release:
    # Not published: a published release refuses uploads here. This does not fire
    # for a draft either - GitHub delivers no release event for drafts - so the
    # release procedure dispatches this by hand, after the SBOMs are attached,
    # because cosign signs whatever is present when it runs. The trigger is kept
    # only for a release published without a draft, where it will at least try.
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose assets to sign (e.g. v6.2.19).'
        type: string
        required: true

permissions: {}

jobs:
  # Authenticode, which is a different thing from the Sigstore signature below
  # and complementary to it: SmartScreen and the UAC prompt read Authenticode
  # and know nothing about Sigstore, while anybody who checks a signature
  # deliberately can verify the cosign bundle without trusting a certificate
  # authority. This job exists so that the day a certificate is bought is the
  # day the installer is signed, rather than the day this file starts being
  # written. It does nothing at all until the four secrets exist, and says so.
  authenticode:
    name: Authenticode-sign the installer (only with a certificate)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Is there a certificate to sign with?
        id: have
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_TENANT_ID }}" ] && [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] \
             && [ -n "${{ secrets.AZURE_CLIENT_SECRET }}" ] && [ -n "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Authenticode certificate is configured, so the installer on this release is unsigned to Windows. \
          SmartScreen will show an unknown-publisher warning. See RELEASE.md, 'Authenticode'."
          fi

      - name: Resolve the tag
        if: steps.have.outputs.ready == 'true'
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download the installer from the release
        if: steps.have.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signing
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" \
             --pattern 'hMailServer-*-x64.exe' --dir signing
          ls -la signing

      - name: Sign it
        if: steps.have.outputs.ready == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: signing
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prove it is signed, then replace the asset
        if: steps.have.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem signing -Filter *.exe | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          "status: $($sig.Status)"
          "signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "The installer is not validly signed: $($sig.Status)" }
          gh release upload "${{ steps.tag.outputs.tag }}" $exe --repo "${{ github.repository }}" --clobber

  sign:
    name: Sign and attach signatures
    runs-on: ubuntu-latest
    permissions:
      # Keyless signing exchanges this for a short-lived Sigstore certificate.
      id-token: write
      # Needed to download the assets and upload the signatures back.
      contents: write

    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag supplied and no release tag in the event payload."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The tag has to be a signed, annotated tag object before anything that
      # hangs off it is signed. Every release tag before 6.2.23 Alpha 2 was a
      # lightweight ref - `git cat-file -t` said "commit" - so there was no tag
      # object and nothing to verify: anyone with push rights to a v* ref could
      # have pointed it elsewhere and the cosign bundles would have signed
      # whatever was attached just the same. Signing is SSH-based (git's own
      # ssh-keygen -Y machinery, no GPG key management) against the allow list
      # in .github/allowed_signers, which is the one file this job checks out
      # the repository for.
      - name: Checkout the allow list of signing keys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/allowed_signers
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse an unsigned or lightweight tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          kind=$(git cat-file -t "refs/tags/${TAG}")
          if [ "${kind}" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag (a bare ${kind} ref). Release tags must be annotated and signed: git tag -s ${TAG} -m '...'. See RELEASE.md step 12."
            exit 1
          fi
          if ! git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "${TAG}"; then
            echo "::error::${TAG} is not signed by a key in .github/allowed_signers. Nothing has been signed."
            exit 1
          fi
          echo "${TAG} is an annotated tag with a valid signature from an allowed key."

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # There is no checkout in this job - it signs assets, it does not need the
          # source - and without a git directory `gh` cannot infer the repository, so
          # it must be told. Omitting this is exactly how the first run of this
          # workflow failed, on the 6.2.19 release: "failed to run git: fatal: not a
          # git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p assets
          # Signatures and bundles from an earlier run are excluded, so re-running
          # this workflow does not sign its own output.
          gh release download "$TAG" --dir assets --pattern '*' --clobber
          rm -f assets/*.cosign.bundle assets/*.sig assets/*.pem
          echo "Assets to sign:"
          ls -la assets

      # The update checker in the server finds the installer by name: it builds
      # hMailServer-<tag without the v>-x64.exe and matches an asset on exact
      # equality, then looks for that name plus .cosign.bundle. A release whose
      # installer is named anything else tells every running server that a new
      # version exists and then that there is nothing to download - which is worse
      # than saying nothing, because the administrator is now waiting for an
      # update that will never arrive. The naming has already been broken once, at
      # v6.2.22-pre3, where the installer was hMailServer-6.2.22-x64.exe under a
      # tag of v6.2.22-pre3. Nothing checked it then; this checks it now, before
      # the signing that publishes the release for good.
      - name: The installer is named the way the update checker looks for it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          installer="hMailServer-${version}-x64.exe"
          if [ ! -f "assets/${installer}" ]; then
            echo "::error::This release has no asset named ${installer}."
            echo "The server's update checker builds that name from the tag and matches it exactly,"
            echo "so a release named anything else is undownloadable by every server in the field."
            echo "Assets present:"
            ls -1 assets
            exit 1
          fi
          echo "Found ${installer}; its .cosign.bundle is produced by the signing step below."

      # One release carries every platform's artefact at one version. The Linux
      # update checker builds the name its own package manager and architecture
      # would install - the four below - and matches it exactly, as the Windows one
      # does the installer. A missing Linux set is a warning and not a failure: the
      # installer is what every server in the field is waiting for, and a Linux
      # packaging problem must not hold it back. RELEASE.md says what a release
      # without them is called.
      - name: Which platforms this release carries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          missing=0
          for name in \
            "hmailserver_${version}_amd64.deb" \
            "hmailserver_${version}_arm64.deb" \
            "hmailserver-${version}-1.x86_64.rpm" \
            "hmailserver-${version}-1.aarch64.rpm"; do
            if [ -f "assets/${name}" ]; then
              echo "Linux: ${name}"
            else
              echo "::warning::No ${name} on ${TAG}. A Linux server of that kind will be told a new version exists and that there is nothing to download."
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -eq 4 ]; then
            echo "::warning::${TAG} carries no Linux packages at all: it is a Windows-only release, and its notes should say so."
          fi

      - name: Sign each asset
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for file in assets/*; do
            [ -f "$file" ] || continue
            echo "::group::Signing $(basename "$file")"
            # --yes accepts the transparency-log notice; the whole point here is
            # that the signature IS publicly logged.
            cosign sign-blob --yes \
              --bundle "${file}.cosign.bundle" \
              "$file"
            signed=$((signed + 1))
            echo "::endgroup::"
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::No assets found on $TAG - nothing was signed."
            exit 1
          fi
          echo "Signed $signed asset(s)."

      - name: Verify what we just signed
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Verifying in the same job is not circular: it proves the bundle is
          # well-formed and the identity matches, which is exactly the failure
          # mode of a mis-configured signing step. A user's own verification is
          # the real check, but a broken bundle should never reach them.
          for bundle in assets/*.cosign.bundle; do
            file="${bundle%.cosign.bundle}"
            echo "::group::Verifying $(basename "$file")"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "^https://github\.com/${REPO}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
            echo "::endgroup::"
          done

      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Same reason as the download step: no checkout, so no inferred repo.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release upload "$TAG" assets/*.cosign.bundle --clobber
