name: Sign release artefacts

# Signs every asset attached to a release with Sigstore cosign, keyless, and
# attaches the signature and certificate bundle alongside it.
#
# RUN THIS WHILE THE RELEASE IS STILL A DRAFT, and run it LAST. Immutable releases
# are enabled here, so a published release refuses further uploads; and this signs
# whatever is attached at the moment it runs, so it has to go after the SBOMs or it
# signs the installer and nothing else. RELEASE.md has the order.
#
# Why: the roadmap records signing as the one genuinely missing supply-chain item.
# SBOMs (SPDX + CycloneDX) already ship with every release, CodeQL and dependency
# review run in CI, and Dependabot is on - but an installer downloaded from the
# releases page carries nothing a user can verify it against. That matters more for
# a mail server than for most software: it runs as a service, with database
# credentials, and it is the kind of thing an attacker would like to substitute.
#
# Keyless deliberately. The alternative is a long-lived signing key, which for a
# single-maintainer project means a secret in GitHub Actions that is itself the
# thing most worth stealing. Keyless signing binds the signature to this
# repository's workflow identity via OIDC, records it in the public Rekor
# transparency log, and leaves no key to leak or rotate.
#
# This does NOT replace Authenticode. Windows SmartScreen and the UAC prompt care
# about Authenticode, not Sigstore, and that needs a certificate this project does
# not currently have (Azure Artifact Signing, until recently called Trusted
# Signing, is the realistic route - and the job below is written for it). Cosign gives
# verifiability today, for anyone who checks; Authenticode remains open on the
# roadmap and the two are complementary, not alternatives.
#
# Verify a downloaded installer with:
#
#   cosign verify-blob \
#     --bundle hMailServer-x.y.z-x64.exe.cosign.bundle \
#     --certificate-identity-regexp '^https://github\.com/Progressiverobot/hmailserver/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     hMailServer-x.y.z-x64.exe

on:
  release:
    # Not published: a published release refuses uploads here. This does not fire
    # for a draft either - GitHub delivers no release event for drafts - so the
    # release procedure dispatches this by hand, after the SBOMs are attached,
    # because cosign signs whatever is present when it runs. The trigger is kept
    # only for a release published without a draft, where it will at least try.
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose assets to sign (e.g. v6.2.19).'
        type: string
        required: true

permissions: {}

# One run at a time for one tag, and queued rather than cancelled. This workflow
# downloads a release's assets, signs the bytes it downloaded, and uploads the
# bundles back to a release that is still a draft and therefore still mutable:
# two dispatches for the same tag overlap happily, and the second one can replace
# an asset - the Authenticode job clobbers the installer - between the moment the
# first one hashed that asset and the moment it attaches the bundle. The bundle
# then names a file whose bytes have changed, and a user who verifies the download
# gets the same answer as for a tampered one. Cancelling in progress would trade
# that for a worse fault, because a run stopped between signing the assets and
# uploading the bundles leaves the release with assets carrying no signature at
# all.
#
# The group name is this workflow's alone. A group is matched as a plain string
# across the whole repository, and the only other groups in .github/workflows are
# `linux-build-<ref>` in linux-build.yml and `server-build-<ref>` in
# server-build.yml - sbom.yml, installer-smoke.yml and every other workflow here
# declare none at all. The prefix below is this workflow's own full name, so it
# can clash with neither of those nor with anything likely to be added.
concurrency:
  group: sign-release-artefacts-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Authenticode, which is a different thing from the Sigstore signature below
  # and complementary to it: SmartScreen and the UAC prompt read Authenticode
  # and know nothing about Sigstore, while anybody who checks a signature
  # deliberately can verify the cosign bundle without trusting a certificate
  # authority. This job exists so that the day an account is arranged is the day
  # the installer is signed, rather than the day this file starts being written.
  # It does nothing at all until the settings exist, and says so.
  #
  # What it does NOT do is remove the SmartScreen warning. Microsoft's own
  # comparison puts a signed installer in the same row as an unsigned one -
  # "flagged as unrecognized until reputation accumulates" - and a new 79 MB file
  # every few weeks never accumulates any. What signing buys is the publisher
  # NAME in the elevation prompt instead of "Unknown publisher", and the fact
  # that an enterprise policy can refuse an unsigned binary outright.
  authenticode:
    name: Authenticode-sign the installer (only with a certificate)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # The gate has to name every value the signing step consumes, and it named
      # four of the six. `Sign it` also reads ARTIFACT_SIGNING_ENDPOINT and
      # ARTIFACT_SIGNING_PROFILE, and those are the two the action itself marks
      # required - signing-account-name, which this gate did check, it marks
      # optional - so the gate validated the wrong four and admitted five
      # configurations that reach the action with a required input left empty.
      # The action throws on the empty endpoint, `sign` declares needs on this
      # job, and so a release that trips it gets no Authenticode signature AND
      # no cosign bundle on any of its twenty assets. On a published release
      # that cannot be corrected afterwards.
      #
      # Hence three outcomes rather than two. None of the six set is the
      # ordinary case and stays a silent no-op with a notice, because a fork -
      # and this repository until an Azure account is arranged - has to be able
      # to cut a release without one. All six set signs. Anything in between is
      # a half-configured release, and the only honest thing to do with it is
      # stop and name the values that are missing, while the release can still
      # be fixed. Widening the gate to six without this third branch would be
      # worse than the bug: a typo in one variable would ship an unsigned
      # installer under a notice claiming no certificate is configured, and
      # nobody would know until a user saw Unknown publisher.
      #
      # The six arrive as environment variables rather than as ${{ }} written
      # into the middle of the script, because an expression is pasted into the
      # shell text before bash parses it: a value holding a quote or a backtick
      # would arrive as syntax rather than as data. Emptiness is judged the way
      # the action judges it, on a value that is blank once its whitespace is
      # taken off, so a variable set to a stray space is missing here too rather
      # than passing the gate and failing inside the action. Only the names of
      # the absent settings are ever echoed, never a value.
      - name: Is there a certificate to sign with?
        id: have
        shell: bash
        env:
          SIGN_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGN_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          configured=()
          missing=()
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                      ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            var="SIGN_${name}"
            if [[ "${!var-}" =~ [^[:space:]] ]]; then
              configured+=("$name")
            else
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All six Authenticode settings are present; the installer will be signed."
          elif [ "${#configured[@]}" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Authenticode certificate is configured, so the installer on this release is unsigned to Windows. \
          SmartScreen will show an unknown-publisher warning. See RELEASE.md, 'Authenticode'."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Authenticode signing is half configured. Missing: ${missing[*]}. See RELEASE.md, 'Authenticode'."
            echo "Set: ${configured[*]}."
            echo "All six are required by the signing step. Fill in the rest, or clear all six to"
            echo "release unsigned deliberately."
            exit 1
          fi

      # Through env, the way the sign job below already does it. A ${{ }} written
      # into the body of a run block is pasted into the script text before bash
      # parses it, so a tag holding a shell metacharacter arrives as syntax
      # rather than as data - and this is the one job in the repository where
      # that matters most, because it is the job that holds the code-signing
      # credentials and contents: write.
      #
      # No longer conditional on the certificate gate: the completeness check below
      # it has to run whether or not there is a certificate to sign with, and it
      # needs the tag. A dispatch with no tag to resolve now fails here rather than
      # in the sign job - the same run, one job earlier, with the same message.
      - name: Resolve the tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag supplied and no release tag in the event payload."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The rest of what a release must carry, asserted rather than described - and
      # asserted HERE, in the first job, rather than beside the cosign steps below.
      # It costs one API call and no download, and the two steps below it that do
      # anything cannot be undone: `Sign it` spends a code-signing certificate, and
      # the step after it replaces the installer asset on the release with what it
      # signed. A release missing an SBOM has to go round again regardless, so the
      # cheapest check is the one that has to come first.
      #
      # Until now the SBOMs were named in this file's header and in RELEASE.md and
      # checked nowhere, and the only count this workflow made was that it had
      # signed more than nothing: a release whose SBOM workflow was never dispatched
      # came through green, was published, and could never be added to afterwards,
      # because an immutable release refuses every later upload. RELEASE.md records
      # what that cost - "6.2.22-pre4 was published straight away and ended up with
      # an installer and no SBOM at all".
      #
      # The sums file is a WARNING and not a failure, deliberately. linux-build.yml
      # computes it in its publish job, from the packages that job has just
      # downloaded, and it is NOT one of the linux-packages-* artefacts - so the
      # recovery path that same job prints into its own log when no release exists
      # yet,
      #
      #   gh run download <id> --pattern 'linux-packages-*' --dir packages
      #   gh release upload <tag> --clobber $(find packages -type f)
      #
      # attaches every .deb, .rpm and .AppImage and no sums file at all. That is a
      # documented, legitimate way to make a release, and nothing on the release
      # tells it apart from an upload that went wrong, so no amount of precision
      # here could separate the two: a hard failure would simply block a good
      # release at its last step, with the tag already spent and unable to back
      # another. The file itself is a list of SHA-256 sums of assets that are each
      # signed individually a few steps below, so its absence costs a convenience
      # and not a guarantee. The SBOMs stay hard because nothing on the release can
      # reconstruct them, and one dispatch of one workflow puts them right.
      - name: Everything the release must carry is on it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Exactly the name linux-build.yml's publish job builds: the tag with its
          # leading v taken off, in that shape. Never a bare "SHA256SUMS" and never
          # a glob - a sums file left over from another version would satisfy a glob
          # and tell a Linux user nothing about this one.
          sums="hmailserver-linux-${version}-SHA256SUMS.txt"

          if ! names="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"; then
            echo "::error::There is no release for ${TAG} to check, draft or published. The draft is created first - RELEASE.md has the order."
            exit 1
          fi
          # Into an array, and compared with = rather than piped into grep: a
          # `printf ... | grep -q` returns grep's answer through a pipeline that
          # `set -o pipefail` also watches, and grep -q exits on its first match
          # while printf is still writing, so a long enough asset list makes the
          # pipeline report printf's SIGPIPE and a present asset read as missing.
          mapfile -t attached <<< "$names"
          echo "Attached to ${TAG}:"
          printf '  %s\n' "${attached[@]}"

          has() {
            local n
            for n in "${attached[@]}"; do
              if [ "$n" = "$1" ]; then
                return 0
              fi
            done
            return 1
          }

          missing=()
          for name in hmailserver.spdx.json hmailserver.cyclonedx.json; do
            if has "$name"; then
              echo "Found ${name}."
            else
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::${TAG} is missing ${#missing[@]} required asset(s): ${missing[*]}."
            echo "The SBOMs come from the SBOM workflow and have to be attached BEFORE this one"
            echo "runs: cosign signs whatever is present when it runs, and a published release"
            echo "takes nothing more. Nothing has been signed and no asset has been replaced."
            echo "  gh workflow run \"SBOM\" -f release_tag=${TAG}"
            echo "then dispatch this workflow again."
            exit 1
          fi

          # By suffix, the way the last step of the sign job classifies too.
          linux=0
          for name in "${attached[@]}"; do
            case "$name" in
              *.deb|*.rpm|*.AppImage) linux=1 ;;
            esac
          done

          if [ "${linux}" -eq 1 ]; then
            if has "$sums"; then
              echo "Found ${sums}."
            else
              # The annotation is one line because that is all an annotation can
              # be; the remedy goes underneath it, the way the rest of this file
              # says anything long.
              echo "::warning::${TAG} carries Linux packages but not ${sums}."
              echo "Not a failure. linux-build.yml computes that file in its publish job and it is"
              echo "not one of the linux-packages-* artefacts, so the hand-run recovery upload that"
              echo "job documents attaches the packages without it."
              echo ""
              echo "To add it, from a directory holding the packages: sha256sum every .deb, .rpm"
              echo "and .AppImage into a file named exactly ${sums}, then"
              echo "  gh release upload ${TAG} ${sums}"
              echo "while the release is still a draft, and dispatch this workflow again so the"
              echo "sums file is signed like everything else."
            fi
          else
            echo "No Linux artefacts on ${TAG}, so no ${sums} is expected."
          fi

      - name: Download the installer from the release
        if: steps.have.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p signing
          gh release download "$TAG" --repo "$REPO" \
             --pattern 'hMailServer-*-x64.exe' --dir signing
          ls -la signing

      - name: Sign it
        if: steps.have.outputs.ready == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: signing
          files-folder-filter: exe
          file-digest: SHA256
          # NOT optional, whatever the input's "required: false" says. The
          # certificates this service issues live about seventy-two hours, so a
          # signature without a countersigned timestamp stops verifying three
          # days later. This is the service's own timestamping authority.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # The action defaults to 300 seconds for the whole signing call. The
          # installer is around 80 MB and only its digest travels, so that is
          # ample - but a slow runner should wait rather than fail a release.
          timeout: 900

      # The countersigned timestamp is proved here as well as the status, because
      # Status alone cannot see the failure this job is most likely to have. The
      # certificates this service issues live about seventy-two hours, and
      # Get-AuthenticodeSignature answers Valid for a signature carrying no
      # timestamp as long as the certificate is still inside its own lifetime -
      # which it always is at this point, the signature having been made seconds
      # earlier. Three days later the same installer reads NotTimeValid on every
      # machine in the field, and the release it came from was published and
      # immutable long before.
      #
      # Throwing for it fails this job, and the sign job below needs this one, so an
      # untimestamped installer costs the release its cosign bundles as well. That
      # trade is taken deliberately, and nothing is lost by it: the throw is BEFORE
      # the `gh release upload` in this same step, so the release still holds the
      # installer it had, the draft is still mutable, and there is nothing to undo.
      # The alternative is a release whose installer stops verifying in three days
      # and which cannot be corrected by then. A run dispatched again is cheap, and
      # the message says what to do next.
      - name: Prove it is signed, then replace the asset
        if: steps.have.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $exe = (Get-ChildItem signing -Filter *.exe | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          "status: $($sig.Status)"
          "signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "The installer is not validly signed: $($sig.Status)" }
          if ($null -eq $sig.TimeStamperCertificate) {
            $lines = @(
              "The installer is signed but carries no RFC3161 countersignature, and reads"
              "Valid here only because the signing certificate is minutes old. That"
              "certificate expires in about seventy-two hours and the signature stops"
              "verifying with it, on a release that is immutable once published."
              ""
              "Nothing has been changed. This check runs before the release asset is"
              "replaced, so the release still holds the installer it had and no cosign"
              "bundle has been made."
              ""
              "Check that the timestamping authority named on the signing step above"
              "(timestamp-rfc3161) is reachable from the runner and that the certificate"
              "profile permits timestamping, then dispatch this workflow again at the same"
              "tag while the release is still a draft."
            )
            throw ($lines -join "`n")
          }
          "timestamper: $($sig.TimeStamperCertificate.Subject)"
          gh release upload "$env:TAG" $exe --repo "$env:REPO" --clobber

  sign:
    # AFTER the Authenticode job, never beside it. That job replaces the
    # installer asset with a signed copy of itself, and cosign signs the bytes of
    # whatever is attached when it runs: signing first and replacing after leaves
    # a .cosign.bundle that does not verify against the file it names. While no
    # certificate is configured the Authenticode job does nothing and succeeds,
    # which satisfies this and costs a few seconds.
    needs: authenticode
    name: Sign and attach signatures
    runs-on: ubuntu-latest
    permissions:
      # Keyless signing exchanges this for a short-lived Sigstore certificate.
      id-token: write
      # Needed to download the assets and upload the signatures back.
      contents: write
    outputs:
      # sha256sum lines of the primary assets as attached, base64: the subjects
      # of the provenance job below.
      hashes: ${{ steps.attached.outputs.hashes }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag supplied and no release tag in the event payload."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The tag has to be a signed, annotated tag object before anything that
      # hangs off it is signed. Every release tag before 6.2.23 Alpha 2 was a
      # lightweight ref - `git cat-file -t` said "commit" - so there was no tag
      # object and nothing to verify: anyone with push rights to a v* ref could
      # have pointed it elsewhere and the cosign bundles would have signed
      # whatever was attached just the same. Signing is SSH-based (git's own
      # ssh-keygen -Y machinery, no GPG key management) against the allow list
      # in .github/allowed_signers, which is the one file this job checks out
      # the repository for.
      - name: Checkout the allow list of signing keys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/allowed_signers
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse an unsigned or lightweight tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          kind=$(git cat-file -t "refs/tags/${TAG}")
          if [ "${kind}" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag (a bare ${kind} ref). Release tags must be annotated and signed: git tag -s ${TAG} -m '...'. See RELEASE.md step 12."
            exit 1
          fi
          if ! git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "${TAG}"; then
            echo "::error::${TAG} is not signed by a key in .github/allowed_signers. Nothing has been signed."
            exit 1
          fi
          echo "${TAG} is an annotated tag with a valid signature from an allowed key."

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # There is no checkout in this job - it signs assets, it does not need the
          # source - and without a git directory `gh` cannot infer the repository, so
          # it must be told. Omitting this is exactly how the first run of this
          # workflow failed, on the 6.2.19 release: "failed to run git: fatal: not a
          # git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p assets
          # What an earlier run attached is excluded, so re-running this workflow
          # does not sign its own output: the bundles and their .sigstore.json
          # twins (a re-run signs the assets again and replaces both), the SLSA
          # provenance the attach-provenance job puts on the release (it describes
          # the assets and is not one of them), and .sig/.pem files. These five
          # suffixes are the whole of this workflow's notion of an asset it does not
          # sign, and the verify step of this job excludes exactly the same five from
          # its rule that every asset carries a bundle, as does the subject list it
          # hands the provenance job: add a kind here and add it there too.
          gh release download "$TAG" --dir assets --pattern '*' --clobber
          rm -f assets/*.cosign.bundle assets/*.sigstore.json assets/*.intoto.jsonl assets/*.sig assets/*.pem
          echo "Assets to sign:"
          ls -la assets

      # The update checker in the server finds the installer by name: it builds
      # hMailServer-<tag without the v>-x64.exe and matches an asset on exact
      # equality, then looks for that name plus .cosign.bundle. A release whose
      # installer is named anything else tells every running server that a new
      # version exists and then that there is nothing to download - which is worse
      # than saying nothing, because the administrator is now waiting for an
      # update that will never arrive. The naming has already been broken once, at
      # v6.2.22-pre3, where the installer was hMailServer-6.2.22-x64.exe under a
      # tag of v6.2.22-pre3. Nothing checked it then; this checks it now, before
      # the signing that publishes the release for good.
      - name: The installer is named the way the update checker looks for it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          installer="hMailServer-${version}-x64.exe"
          if [ ! -f "assets/${installer}" ]; then
            echo "::error::This release has no asset named ${installer}."
            echo "The server's update checker builds that name from the tag and matches it exactly,"
            echo "so a release named anything else is undownloadable by every server in the field."
            echo "Assets present:"
            ls -1 assets
            exit 1
          fi
          echo "Found ${installer}; its .cosign.bundle is produced by the signing step below."

      # One release carries every platform's artefact at one version. The Linux
      # update checker builds the name its own package manager and architecture
      # would install - the four below - and matches it exactly, as the Windows one
      # does the installer. A missing Linux set is a warning and not a failure: the
      # installer is what every server in the field is waiting for, and a Linux
      # packaging problem must not hold it back. RELEASE.md says what a release
      # without them is called.
      - name: Which platforms this release carries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          missing=0
          for name in \
            "hmailserver_${version}_amd64.deb" \
            "hmailserver_${version}_arm64.deb" \
            "hmailserver-${version}-1.x86_64.rpm" \
            "hmailserver-${version}-1.aarch64.rpm"; do
            if [ -f "assets/${name}" ]; then
              echo "Linux: ${name}"
            else
              echo "::warning::No ${name} on ${TAG}. A Linux server of that kind will be told a new version exists and that there is nothing to download."
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -eq 4 ]; then
            echo "::warning::${TAG} carries no Linux packages at all: it is a Windows-only release, and its notes should say so."
          fi

      - name: Sign each asset
        id: signing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for file in assets/*; do
            [ -f "$file" ] || continue
            echo "::group::Signing $(basename "$file")"
            # --yes accepts the transparency-log notice; the whole point here is
            # that the signature IS publicly logged.
            cosign sign-blob --yes \
              --bundle "${file}.cosign.bundle" \
              "$file"
            # The same bytes under the name OpenSSF Scorecard's Signed-Releases
            # check recognises (.sigstore.json). The server's update verifier and
            # every installation in the field look for .cosign.bundle, so that
            # name stays; the twin is for the scanner, and is verified as attached
            # to be byte-identical below.
            cp "${file}.cosign.bundle" "${file}.sigstore.json"
            signed=$((signed + 1))
            echo "::endgroup::"
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::No assets found on $TAG - nothing was signed."
            exit 1
          fi
          echo "count=${signed}" >> "$GITHUB_OUTPUT"
          echo "Signed $signed asset(s)."

      - name: Verify what we just signed
        env:
          REPO: ${{ github.repository }}
          SIGNED: ${{ steps.signing.outputs.count }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Verifying in the same job is not circular: it proves the bundle is
          # well-formed and the identity matches, which is exactly the failure
          # mode of a mis-configured signing step. A user's own verification is
          # the real check, but a broken bundle should never reach them.
          #
          # The count is asserted afterwards because this loop is a glob: with no
          # bundles in ./assets it iterates nothing, verifies nothing and passes -
          # which is precisely the shape of a signing step that produced no output.
          # It has to check as many bundles as that step says it made.
          verified=0
          for bundle in assets/*.cosign.bundle; do
            file="${bundle%.cosign.bundle}"
            echo "::group::Verifying $(basename "$file")"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "^https://github\.com/${REPO}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
            verified=$((verified + 1))
            echo "::endgroup::"
          done

          # The count from the signing step is compared as a number, so it has to
          # BE one. An empty value - a step output that never got written because
          # the step above changed - makes [ x -ne "" ] exit 2, which an if reads
          # as false, and this check would then pass having proved nothing. That
          # is the exact shape of the bug this step exists to close, so it is
          # refused here rather than trusted.
          case "${SIGNED}" in
            ''|*[!0-9]*)
              echo "::error::The signing step reported '${SIGNED}' as the number of assets it signed, which is not a number. This step cannot confirm what it verified, so it refuses to pass."
              exit 1
              ;;
          esac
          if [ "${verified}" -eq 0 ]; then
            echo "::error::There are no bundles in ./assets to verify, so this step checked nothing at all. The signing step above reported ${SIGNED}."
            exit 1
          fi
          if [ "${verified}" -ne "${SIGNED}" ]; then
            echo "::error::The step above signed ${SIGNED} asset(s) and ${verified} bundle(s) verified here. Nothing has been attached to the release."
            exit 1
          fi
          echo "Verified ${verified} of ${SIGNED} bundle(s)."

      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Same reason as the download step: no checkout, so no inferred repo.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release upload "$TAG" assets/*.cosign.bundle assets/*.sigstore.json --clobber

      # Everything above verifies this job's own copy in ./assets, which proves the
      # bundles are well-formed and says nothing whatever about the release. The
      # release is a draft while this runs and stays mutable until somebody
      # publishes it, and there are four known ways an asset changes after it has
      # been signed: the Linux build's publish job re-runs and re-uploads its
      # packages with --clobber, the SBOM workflow is dispatched a second time and
      # uploads its two files with --clobber, a second dispatch of this workflow
      # replaces the installer with a freshly Authenticode-signed copy of it, and
      # the recovery commands the Linux job prints into its own log are pasted by
      # hand into a terminal. Each of those leaves a bundle that signs bytes the
      # release no longer holds, and to a user who verifies a download that is
      # indistinguishable from tampering.
      #
      # So the last thing this job does is fetch the release exactly as it is
      # attached and verify every asset against the bundle attached beside it. A
      # green run here means the release was correct at that moment. What RELEASE.md
      # does after this step is the installer smoke test and `gh release view
      # vX.Y.Z --json assets`, and neither attaches or replaces anything -
      # installer-smoke.yml downloads the installer from the release and keeps its
      # own results as a run artefact, and `gh release view` reads - so nothing
      # between here and `gh release edit vX.Y.Z --draft=false` changes an asset.
      # Dispatch any of the four workflows above again, though, and this step's
      # answer is the answer to an older question: dispatch this one again too, and
      # publish on a green run.
      - name: Verify the release as attached, not as we signed it
        id: attached
        env:
          GH_TOKEN: ${{ github.token }}
          # Same reason as the download step: no checkout, so no inferred repo.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf published
          mkdir -p published
          gh release download "$TAG" --dir published --pattern '*' --clobber
          echo "The release as attached:"
          ls -la published

          primary=0
          verified=0
          bundles=0
          twins=0
          provenance=0
          unsigned=0
          bad=0
          # Classified by SUFFIX, and by exactly the kinds the download step at the
          # top of this job strips before signing: a .sig or a .pem is deliberately
          # not signed there, a .sigstore.json is a bundle's twin and an
          # .intoto.jsonl is the provenance attached after this job, so demanding a
          # bundle beside one here would fail this step permanently on a release
          # that is perfectly correct.
          # The patterns are anchored at the end of the name, as that `rm` is, so an
          # asset whose name merely CONTAINS .cosign.bundle - notes.cosign.bundle.txt
          # - is a primary asset here and was signed there, which agrees.
          for file in published/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            case "$name" in
              *.cosign.bundle)
                bundles=$((bundles + 1))
                continue
                ;;
              *.sigstore.json)
                twins=$((twins + 1))
                continue
                ;;
              *.intoto.jsonl)
                provenance=$((provenance + 1))
                echo "${name} is SLSA provenance: it describes the assets and is verified by the attach-provenance job, not signed here."
                continue
                ;;
              *.sig|*.pem)
                unsigned=$((unsigned + 1))
                echo "${name} is a kind this workflow does not sign, so no bundle is expected beside it."
                continue
                ;;
            esac
            primary=$((primary + 1))
            if [ ! -f "${file}.cosign.bundle" ]; then
              echo "::error::${name} is attached to ${TAG} with no signature beside it: it went on after the signing step above, or its bundle failed to upload."
              bad=$((bad + 1))
              continue
            fi
            echo "::group::Verifying ${name} as attached"
            if cosign verify-blob \
              --bundle "${file}.cosign.bundle" \
              --certificate-identity-regexp "^https://github\.com/${REPO}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"; then
              verified=$((verified + 1))
              echo "${name} verifies against the bundle attached to ${TAG}."
            else
              echo "::error::${name} does NOT verify against the bundle attached to ${TAG}: its bytes changed after they were signed. Find out what replaced it, dispatch this workflow again, and do not publish until this step is green."
              bad=$((bad + 1))
            fi
            echo "::endgroup::"
          done

          # Every bundle has its .sigstore.json twin attached, byte for byte: a twin
          # that differs would be a second signature that verifies against nothing,
          # and a missing one would be a release the Scorecard scanner reads as
          # unsigned while the field reads it as signed.
          for bundle in published/*.cosign.bundle; do
            twin="${bundle%.cosign.bundle}.sigstore.json"
            if [ ! -f "$twin" ]; then
              echo "::error::$(basename "$bundle") has no .sigstore.json twin attached to ${TAG}."
              bad=$((bad + 1))
            elif ! cmp -s "$bundle" "$twin"; then
              echo "::error::$(basename "$twin") differs from $(basename "$bundle"): the twin must be the same bytes."
              bad=$((bad + 1))
            fi
          done
          echo "${twins} .sigstore.json twin(s) attached beside ${bundles} bundle(s)."

          # The primary assets' digests, as attached, for the provenance job below.
          hashes=""
          for file in published/*; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in *.cosign.bundle|*.sigstore.json|*.intoto.jsonl|*.sig|*.pem) continue ;; esac
            hashes="${hashes}$(sha256sum "$file" | sed "s|published/||")\n"
          done
          echo "hashes=$(printf '%b' "$hashes" | base64 -w0)" >> "$GITHUB_OUTPUT"

          # The other direction: a bundle whose file is gone is the signature of an
          # asset somebody deleted after it was signed.
          for bundle in published/*.cosign.bundle; do
            file="${bundle%.cosign.bundle}"
            if [ ! -f "$file" ]; then
              echo "::error::$(basename "$bundle") is attached to ${TAG} but $(basename "$file") is not: a signature for an asset that is no longer on the release."
              bad=$((bad + 1))
            fi
          done

          # This step globs a directory it filled itself, so it can pass having
          # checked nothing: an empty download, or a release carrying bundles and
          # nothing else, runs both loops zero times and succeeds.
          if [ "${primary}" -eq 0 ]; then
            echo "::error::${TAG} has ${bundles} bundle(s) and not one signable asset, so this step verified nothing at all. That is not a release."
            exit 1
          fi

          if [ "${bad}" -ne 0 ]; then
            echo "::error::${TAG} is not correctly signed as it is attached, and must not be published in this state."
            exit 1
          fi

          if [ "${verified}" -ne "${primary}" ]; then
            echo "::error::${TAG} carries ${primary} signable asset(s) and only ${verified} verified. Refusing to call this release signed."
            exit 1
          fi

          echo "${verified} of ${primary} asset(s) on ${TAG} verify against the bundle attached beside them: ${bundles} bundle(s), ${unsigned} asset(s) unsigned by design."

  # SLSA build provenance for the assets as attached, generated by the SLSA
  # project's own reusable workflow on its own isolated runner. It says which
  # workflow, at which commit, produced files with these digests, and it is what
  # OpenSSF Scorecard's Signed-Releases check scores as provenance. Referenced by
  # tag rather than by commit because the generator verifies itself against its
  # release tag and documents that a commit pin is not supported; Scorecard's
  # Pinned-Dependencies check makes the same exception for it. The subjects are
  # the digests the sign job read back from the release, so the provenance
  # describes what is attached, not what was uploaded.
  #
  # The generator's own upload-assets option is NOT used. It looks a release up
  # by tag through the API that does not return drafts, and the release is a
  # draft when this workflow runs (RELEASE.md: sign last, publish after): the
  # rehearsal of 11 September 2026 saw it create a second, published, empty
  # release under the same tag and fail. The provenance is a workflow artifact
  # here, and the job after this one attaches it with gh, which resolves drafts.
  provenance:
    needs: sign
    permissions:
      actions: read
      id-token: write
      # Read would do - nothing in the generator writes to the repository when
      # upload-assets is off - but GitHub validates a called workflow's declared
      # permissions against the caller's at startup, before any `if` is
      # evaluated, and the generator's (skipped) upload job declares contents:
      # write. Granting less is a startup failure of this whole workflow.
      contents: write
    # By tag, and deliberately the one action reference here not pinned by hash:
    # slsa-verifier checks the builder identity recorded in the provenance
    # against the generator's release tag and refuses a workflow reached by
    # commit hash, so the tag is the pin. Scorecard's Pinned-Dependencies check
    # deducts for it (its alert on this line is dismissed as won't fix, citing
    # this); that point is the price of provenance that verifies.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      provenance-name: hmailserver-${{ needs.sign.outputs.tag }}.intoto.jsonl

  attach-provenance:
    name: Attach and verify the provenance
    needs: [sign, provenance]
    runs-on: ubuntu-latest
    permissions:
      # The provenance artifact, and the release to attach it to.
      actions: read
      contents: write
    steps:
      - name: Fetch the provenance the generator made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.sign.outputs.tag }}
          NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          ls -la provenance
          [ -s "provenance/${NAME}" ] || { echo "::error::the generator's artifact holds no ${NAME}."; exit 1; }
          gh release upload "$TAG" "provenance/${NAME}" --clobber

      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify the provenance as attached, against the assets as attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.sign.outputs.tag }}
          NAME: ${{ needs.provenance.outputs.provenance-name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf published
          mkdir -p published
          gh release download "$TAG" --dir published --pattern '*' --clobber
          # The bytes on the release are the bytes the generator signed.
          if ! cmp -s "provenance/${NAME}" "published/${NAME}"; then
            echo "::error::${NAME} as attached to ${TAG} is not the file the generator made."
            exit 1
          fi
          # Every primary asset is a subject of the provenance, and the provenance
          # was made by the SLSA generator for THIS repository at the ref this run
          # was started from: a signature by anybody else, or for another
          # repository, or over other bytes, fails here. The ref is the branch the
          # workflow was dispatched on (master, for a release cut by RELEASE.md),
          # or the tag when it was dispatched on one.
          case "$REF_TYPE" in
            tag) ref_arg="--source-tag=${REF_NAME}" ;;
            *)   ref_arg="--source-branch=${REF_NAME}" ;;
          esac
          subjects=()
          for file in published/*; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in *.cosign.bundle|*.sigstore.json|*.intoto.jsonl|*.sig|*.pem) continue ;; esac
            subjects+=("$file")
          done
          if [ "${#subjects[@]}" -eq 0 ]; then
            echo "::error::${TAG} carries no primary asset to verify the provenance against."
            exit 1
          fi
          slsa-verifier verify-artifact "${subjects[@]}" \
            --provenance-path "published/${NAME}" \
            --source-uri "github.com/${REPO}" \
            "$ref_arg"
          echo "${NAME} on ${TAG} verifies for ${#subjects[@]} asset(s), built by the SLSA generator for github.com/${REPO} at ${REF_TYPE} ${REF_NAME}."
