name: CodeQL

# Static analysis for both languages in this repository.
#
# C# (the Control Panel and the setup and migration tools) runs on every push
# and pull request. It builds on a GitHub-hosted runner in a couple of minutes,
# so it is cheap enough to gate changes on.
#
# C++ (the mail server - every protocol parser, and the whole surface that faces
# the internet) runs on every push to master, weekly, and on demand, and
# deliberately NOT on pull requests. It builds on the same GitHub-hosted
# windows-2025-vs2026 runner as server-build.yml, with the same native
# dependencies restored from the same caches, so the reasons this used to be a
# weekly-only job - one self-hosted machine that was never registered, shared
# with the regression suite - are gone. What remains is the cost of the analysis
# itself:
#
#   * CodeQL builds its database by tracing the compiler, so it needs a FULL
#     build every time: 516 translation units under the extractor, which is
#     several times slower than the plain build, and then query evaluation over
#     6.1 MB of C++. An hour or so per run on a hosted runner, against a few
#     minutes for the C# job.
#   * A pull request's alerts would be attributed to the branch, and then again
#     to master when it merges. Analysing master on every push gives one
#     analysis per merged change, which is what the code-scanning alerts are
#     keyed on.
#
# The cost of that choice, stated plainly: an alert introduced by a pull request
# is not seen until the push to master that merges it, and is then attributed
# to that merge rather than to the review. When a change touches the protocol
# parsers, run this workflow by hand against the branch (workflow_dispatch)
# before merging rather than waiting for the merge.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '32 4 * * 1'   # weekly, Monday 04:32 UTC
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration for the C++ server analysis'
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

jobs:
  csharp:
    name: Analyze (csharp)
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # security-and-quality adds the quality-tagged queries to the security
      # suite; their findings surface as code-scanning alerts, with type
      # information from a real build and the config file's query filters
      # applied. They cannot be sent to the Code Quality page: that page is fed
      # only by GitHub's own default-setup scan (the action refuses a
      # code-quality analysis kind from a custom workflow - "for
      # GitHub-internal use only", measured 4 September 2026 - so the
      # obvious route is closed). The managed scan of C# read no configuration
      # and reported, without types, the exact rules the config excludes with
      # measured reasoning: 1,400 findings, some 1,300 of them those rules. Its
      # default setup is scoped to Python; C# quality is this job's business.
      # The six rules that fire in bulk on deliberate design rather than on
      # defects are filtered in the config file, each with its count and the
      # reasoning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # Both solutions, deliberately: for a traced build, CodeQL analyses only
      # what the compiler compiles, so a project left out of this step is a
      # project that has never been scanned. That was DBUpdater, DBSetup,
      # DBSetupQuick, DataDirectorySynchronizer, ImportTool and Shared until
      # the managed quality scan's findings revealed the gap - the only scanner
      # covering those tools was the one being switched off for ignoring the
      # config. The test projects are not built here and stay unscanned:
      # fixtures, not shipped code.
      # RestoreLockedMode: the implicit restore inside these builds is held to
      # the committed packages.lock.json files, the same way ci.yml's explicit
      # restores are, so the code that is analysed is built against the graph
      # that was reviewed.
      - name: Build Control Panel
        run: dotnet build hmailserver/source/Tools/ControlPanel/ControlPanel.csproj -c Release -p:RestoreLockedMode=true

      - name: Build the setup and migration tools
        run: dotnet build "hmailserver/source/Tools/hMailServer Tools.sln" -c Release -p:RestoreLockedMode=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:csharp"
          upload: never
          output: sarif-results

      # paths-ignore in codeql-config.yml cannot drop these results: for a
      # compiled language analysed with build-mode: manual, CodeQL extracts
      # whatever the compiler compiles - including the WPF XAML compiler's
      # *.g.cs under obj/ and the WinForms designer's *.Designer.cs - and a
      # config file's path filters only restrict extraction for interpreted
      # languages or for build-mode: none. So both are dropped from the SARIF
      # here, between analyse and upload, for the reasons the config records:
      # build output is regenerated on every build, and designer files are
      # rewritten by Visual Studio on every designer save, so a fix in either
      # lasts until the next one. The first scan of the setup tools showed
      # nine designer-file results, every one a cast the designer itself wrote.
      #
      # Every SARIF file the analysis wrote goes through the same filter.
      - name: Drop build-output and designer-generated results from the SARIF
        shell: python
        run: |
          import glob
          import json

          def in_build_output(result):
              locations = result.get("locations") or []
              if not locations:
                  return False
              uri = locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
              if uri.lower().endswith(".designer.cs"):
                  return True
              return any(part in ("obj", "bin") for part in uri.split("/"))

          for path in sorted(glob.glob("sarif-results/*.sarif")):
              with open(path, encoding="utf-8") as f:
                  sarif = json.load(f)
              for run in sarif["runs"]:
                  before = len(run["results"])
                  run["results"] = [r for r in run["results"] if not in_build_output(r)]
                  print(f"{path}: dropped {before - len(run['results'])} build-output or designer-generated result(s); {len(run['results'])} remain.")
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(sarif, f)

      - name: Upload results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results
          category: "/language:csharp"

  cpp:
    name: Analyze (c-cpp)
    # Push to master, schedule and manual dispatch only - see the header.
    if: github.event_name != 'pull_request'
    # The runner image is written once, here: it is both the label the job runs
    # on and part of every library cache key the native-dependencies action
    # builds, and `runs-on` does not accept the `env` context. `name:` above
    # keeps the matrix value out of the job title in the web UI.
    strategy:
      matrix:
        image: [windows-2025-vs2026]
    runs-on: ${{ matrix.image }}
    # A cold run builds the three native libraries first (30-45 minutes), then
    # traces 516 translation units and evaluates the queries. Bounded so a
    # wedged run cannot hold a runner for the day.
    timeout-minutes: 240
    permissions:
      security-events: write
      actions: read
      contents: read
    env:
      # Where the library build scripts download and build into; the build
      # scripts and hMailServer.vcxproj both read this variable.
      hMailServerLibs: C:\hMailLibs
      # inputs.configuration is empty on a scheduled run or a push, and
      # build.ps1 defaults to Debug when handed an empty string - which would
      # quietly analyse the _DEBUG preprocessor path instead of the one that
      # ships.
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before CodeQL's init, deliberately: init puts the tracer into the
      # environment of every later step, and OpenSSL, Boost and libpq compiled
      # under it would be extracted into the database - hours of tracing for
      # three libraries this repository does not own, with their findings
      # filed against it. Built or restored here, they are just files on disk
      # when the traced build links against them.
      - name: Restore or build the native dependencies
        uses: ./.github/actions/native-dependencies
        with:
          libs-path: ${{ env.hMailServerLibs }}
          runner-image: ${{ matrix.image }}

      # security-extended rather than security-and-quality, deliberately, and
      # this is the one place the two languages are configured differently:
      #
      #   * CodeQL ships no quality-tagged queries for C++ at all (measured
      #     in d1c35ec: 108 for C#, zero for C++), so security-and-quality
      #     would add nothing but the generic maintainability set.
      #   * What it would buy is roughly a hundred maintainability and
      #     reliability queries let loose on 6.1 MB of twenty-year-old ATL/COM
      #     C++, on a codebase that has never been scanned once. d1c35ec was
      #     written because 733 undifferentiated findings are "not a signal
      #     anyone can act on"; burying the first ever security scan of the
      #     protocol parsers under style alerts repeats that mistake.
      #
      # security-extended is strictly more security coverage with no quality
      # queries, which is what this analysis is for. Once the security backlog
      # is triaged, moving this to security-and-quality is a one-word change -
      # but do it from a measured count, not on principle.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      # A fresh runner has no build output, so every translation unit is
      # compiled and the extractor sees all of them. (On the self-hosted runner
      # this replaced, a reused workspace made -Clean necessary: MSBuild would
      # skip every up-to-date file and the analysis failed with "No source code
      # was seen during the build".) build.ps1 disables the pre- and post-build
      # events, so nothing here stops or starts a service.
      - name: Build server under CodeQL tracing
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\build.ps1 -Configuration $env:BUILD_CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:c-cpp"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-cpp-build-logs
          path: |
            logs/build-*.log
            libraries/build-*.log
          if-no-files-found: ignore
