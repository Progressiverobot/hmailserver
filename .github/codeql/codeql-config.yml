name: "hMailServer CodeQL config"

# Scope the analysis to code that ships, and to rules that mean something here.
#
# The test harnesses are fixtures rather than shipped code; grading the
# project's reliability on its own test scaffolding buries the signal from the
# code users actually run. Everything that ships stays in scope.
paths-ignore:
  - hmailserver/test
  # WinForms designer files are generated by Visual Studio and rewritten
  # whenever a form is edited, so anything "fixed" in them is lost on the next
  # designer save. Every finding in them was the same one: the generated
  # IContainer components field could be readonly.
  - "**/*.Designer.cs"
  - "**/*.designer.cs"

# Three rules fire in bulk on deliberate design rather than on defects. They are
# excluded here with the reasoning recorded, rather than silenced by scattering
# suppression comments through the source or - worse - "fixed" by changes that
# would make the product less robust.
query-filters:
  # 160 hits, essentially all in the Control Panel. It is a COM-interop desktop
  # application: almost every call crosses into the hMailServer service and can
  # fail with COMException, InvalidComObjectException, a reflection wrapper
  # around either, or a server-side error surfaced as a plain Exception.
  # Catching the base type is the deliberate policy - a settings page that
  # cannot read one value must show a message, not take the window down with
  # it. Enumerating specific types would guarantee that the one unlisted type
  # crashes the GUI, which is the outcome this rule exists to prevent.
  - exclude:
      id: cs/catch-of-all-exceptions

  # 30 hits, the same design seen from the other side: handlers that
  # intentionally do nothing, such as a failed UI confirmation that must not
  # turn a successful save into an error. The blocks carry comments explaining
  # each case; the rule counts statements, so the only way to satisfy it would
  # be to add a no-op purely to appease the analyser.
  - exclude:
      id: cs/empty-catch-block

  # Informational rather than a defect: these simply report that the code calls
  # into unmanaged code. It has to - the Control Panel talks to the COM API and
  # uses the Windows APIs for DPAPI, service control and UI automation.
  - exclude:
      id: cs/call-to-unmanaged-code
  - exclude:
      id: cs/unmanaged-code
  # 10 hits, every one a false positive. The rule warns that Path.Combine
  # discards earlier arguments when a later one is rooted. In each case here the
  # later argument is a string literal or a filename this code just built, so it
  # cannot be rooted. ScriptsView is the clearest example: two lines above the
  # flagged call it already does the Path.IsPathRooted check the rule asks for,
  # and returns early - and is still flagged.
  - exclude:
      id: cs/path-combine
