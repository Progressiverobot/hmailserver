name: "hMailServer CodeQL config"

# Scope the analysis to code that actually ships.
#
# Measured with CodeQL's own csharp-code-quality suite across every C# solution
# in the tree, the 958 quality findings broke down like this:
#
#     333  Administrator      - retired GUI, since removed from the repository
#     297  test harnesses     - never shipped
#     227  Control Panel      - shipped, and none of them real defects
#     101  legacy setup tools - shipped (DBSetup, DBUpdater, ...)
#
# Narrowing to the rules that indicate a genuine defect rather than style or
# deliberate design left 132, of which none were in the Control Panel.
#
# The Administrator is gone, so only the test harnesses need excluding here:
# they are fixtures, not shipped code, and grading the project's reliability on
# its own test scaffolding buries the signal from the code users actually run.
#
# Everything that ships stays in scope - the Control Panel and the setup tools.
paths-ignore:
  - hmailserver/test
