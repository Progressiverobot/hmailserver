name: "hMailServer CodeQL config"

# Scope the analysis to code that ships, and to rules that mean something here.
#
# Shared by both analyses in .github/workflows/codeql.yml - the C# Control Panel
# and the C++ server. Query SUITE selection is not here: it differs per language
# and is set on each Initialize CodeQL step, with the reasoning at that point.
# In short, C# runs security-and-quality (quality findings surface as ordinary
# code-scanning alerts) and C++ runs security-extended (CodeQL ships no
# quality-tagged queries for C++, so the quality half would add noise for no
# coverage). Everything below - the paths and the rule filters - applies to
# both. The separate "Code quality" page was fed by a GitHub-managed buildless
# scan that ignored this file entirely - no filters, no type information - and
# was deliberately switched off in favour of this configured analysis.
#
# The test harnesses are fixtures rather than shipped code; grading the
# project's reliability on its own test scaffolding buries the signal from the
# code users actually run. Everything that ships stays in scope.
paths-ignore:
  # In practice this filters C# only: hMailServer.sln compiles nothing under
  # hmailserver/test, so the C++ analysis never sees those paths to begin with.
  - hmailserver/test
  # WinForms designer files are generated by Visual Studio and rewritten
  # whenever a form is edited, so anything "fixed" in them is lost on the next
  # designer save. Every finding in them was the same one: the generated
  # IContainer components field could be readonly.
  - "**/*.Designer.cs"
  - "**/*.designer.cs"
  # Build output. obj/ and bin/ are not committed (.gitignore lines 19-20), but
  # the C# analysis traces the compiler, and the compiler consumes generated
  # sources from obj/ - the WPF XAML compiler's *.g.cs partial classes. Those
  # files are regenerated on every build, so a finding in one is unactionable
  # and merely duplicates the scan of the hand-written half of the same partial
  # class. These two entries are intent, not mechanism: a config file's path
  # filters only restrict extraction for interpreted languages or for
  # build-mode: none, and the C# job builds with build-mode: manual, so CodeQL
  # analyses whatever csc compiles no matter what is listed here. The results
  # are actually dropped in codeql.yml, which filters obj/ and bin/ out of the
  # SARIF between the analyse and upload steps.
  - "**/obj/**"
  - "**/bin/**"

# Three rules fire in bulk on deliberate design rather than on defects. They are
# excluded here with the reasoning recorded, rather than silenced by scattering
# suppression comments through the source or - worse - "fixed" by changes that
# would make the product less robust.
#
# Every id below is a cs/ rule, so these filters are no-ops for the C++
# analysis. Nothing has been excluded for C++: it has never been scanned, so
# there is no measured count to exclude anything on, and an exclusion without a
# count is a guess. Add one after the first run, with the number, or not at all.
query-filters:
  # 160 hits, essentially all in the Control Panel. It is a COM-interop desktop
  # application: almost every call crosses into the hMailServer service and can
  # fail with COMException, InvalidComObjectException, a reflection wrapper
  # around either, or a server-side error surfaced as a plain Exception.
  # Catching the base type is the deliberate policy - a settings page that
  # cannot read one value must show a message, not take the window down with
  # it. Enumerating specific types would guarantee that the one unlisted type
  # crashes the GUI, which is the outcome this rule exists to prevent.
  - exclude:
      id: cs/catch-of-all-exceptions

  # 30 hits, the same design seen from the other side: handlers that
  # intentionally do nothing, such as a failed UI confirmation that must not
  # turn a successful save into an error. The blocks carry comments explaining
  # each case; the rule counts statements, so the only way to satisfy it would
  # be to add a no-op purely to appease the analyser.
  - exclude:
      id: cs/empty-catch-block

  # Informational rather than a defect: these simply report that the code calls
  # into unmanaged code. It has to - the Control Panel talks to the COM API and
  # uses the Windows APIs for DPAPI, service control and UI automation.
  - exclude:
      id: cs/call-to-unmanaged-code
  - exclude:
      id: cs/unmanaged-code
  # 10 hits, every one a false positive. The rule warns that Path.Combine
  # discards earlier arguments when a later one is rooted. In each case here the
  # later argument is a string literal or a filename this code just built, so it
  # cannot be rooted. ScriptsView is the clearest example: two lines above the
  # flagged call it already does the Path.IsPathRooted check the rule asks for,
  # and returns early - and is still flagged.
  - exclude:
      id: cs/path-combine

  # 385 hits in the current scan, spread across 36 files - first triaged in
  # August, with more appearing every time a view touches another COM property,
  # which is what moved this from per-alert dismissals to a filter. Every one is a cast applied to a COM property read
  # through a `dynamic`, and CodeQL's message states the reasoning it is using:
  # "There is no need to upcast from dynamic to Int32 - the conversion can be
  # done implicitly." That is true of the conversion in isolation and wrong
  # about the code, because an implicit conversion from dynamic makes the
  # ENCLOSING expression dynamic too. A call written with the cast binds its
  # overload at compile time; drop the cast and the whole call is dispatched at
  # runtime, so a wrong overload becomes a runtime exception in a GUI instead of
  # a build error. The casts are also the only place the expected type of a
  # late-bound COM property is written down anywhere.
  - exclude:
      id: cs/useless-upcast
