    </div>`).join("")||'<div class="note">'+t("No criteria: the rule matches every message.")+'</div>';
  const actions=d.actions.map((a,i)=>{
    const params=words.actions[a.type]||[];
    const controls=params.map(p=>{
      const value=a[p]!==undefined?a[p]:(params.length===1?(a.value||""):"");
      if(p==="route_id")
        return '<select data-r="act-'+p+'" data-i="'+i+'">'+optionsHtml(routeChoices,value)+'</select>';
      // The one flag among the parameters, with the desktop dialog's caption.
      if(p==="abort_spam_flagged")
        return '<label class="row" style="gap:7px"><input type="checkbox" data-r="act-'+p+'" data-i="'+i+'"'+(value===true?" checked":"")+'> '+t("Abort on messages marked as spam")+'</label>';
      if(p==="body")
        return '<textarea data-r="act-'+p+'" data-i="'+i+'" rows="3" placeholder="'+escHtml(t("Body"))+'" style="flex:1;min-width:240px">'+escHtml(value)+'</textarea>';
      return '<input data-r="act-'+p+'" data-i="'+i+'" placeholder="'+escHtml(humanise(p))+'" value="'+escHtml(value)+'" style="flex:1;min-width:170px">';
    }).join("")||'<span class="muted" style="font-size:12.5px">'+t("This action takes no parameters.")+'</span>';
    return `<div class="row erow">
      <select data-r="act-type" data-i="${i}">${optionsHtml(words.types,a.type)}</select>
      ${controls}
      <button class="btn ghost sm" data-act="actdel" data-i="${i}">${t("Remove")}</button>
    </div>`;
  }).join("")||'<div class="note">'+t("No actions: the rule does nothing.")+'</div>';
  $("#content").innerHTML=`<div class="view">
    <button class="btn ghost sm" data-act="cancel">${t("‹ All rules")}</button>
    <div class="sect"><h2>${editing.id?tf("Edit rule {0}",escHtml(editing.id)):t("New rule")}</h2>
      <div class="card flat">
        <div class="row">
          <input id="ruleName" placeholder="${t("Rule name")}" value="${escHtml(d.name||"")}" style="flex:1;min-width:240px">
          <label class="row" style="gap:7px"><input type="checkbox" id="ruleActive"${d.active?" checked":""}> ${t("Active")}</label>
          <select id="ruleAll">${optionsHtml([{value:"all",label:t("Every criterion must match")},{value:"any",label:t("Any one criterion matches")}],d.all_criteria?"all":"any")}</select>
        </div>
      </div>
    </div>
    <div class="sect"><h2>${t("When")}</h2><div class="card flat">${criteria}
      <div class="row" style="margin-top:14px"><button class="btn ghost sm" data-act="critadd">${t("Add criterion")}</button></div></div></div>
    <div class="sect"><h2>${t("Then")}</h2><div class="card flat">${actions}
      <div class="row" style="margin-top:14px"><button class="btn ghost sm" data-act="actadd">${t("Add action")}</button></div></div></div>
    <div class="sect"><div class="row">
      <button class="btn" data-act="rulesave">${t("Save rule")}</button>
      <button class="btn ghost" data-act="cancel">${t("Cancel")}</button>
      <div class="err" id="err_ruleedit"></div>
    </div></div>
  </div>`;
}
function readRuleForm(){
  const d=editing.rule;
  d.name=$("#ruleName").value;
  d.active=$("#ruleActive").checked;
  d.all_criteria=$("#ruleAll").value==="all";
  document.querySelectorAll("#content [data-r]").forEach(el=>{
    const i=Number(el.dataset.i), r=el.dataset.r;
    if(r.indexOf("crit-")===0){if(d.criteria[i])d.criteria[i][r.slice(5)]=el.value;}
    else if(r.indexOf("act-")===0){if(d.actions[i])d.actions[i][r.slice(4)]=el.type==="checkbox"?el.checked:el.value;}
  });
}
async function saveRule(){
  readRuleForm();
  setErr("err_ruleedit","");
  const words=ruleWords(), d=editing.rule;
  const body={
    name:d.name,active:!!d.active,all_criteria:!!d.all_criteria,
    criteria:d.criteria.map(c=>{
      const o={field:c.field,match:c.match,value:c.value||""};
      if(c.field==="header")o.header=c.header||"";
      return o;
    }),
    // Only the parameters that carry something: the create refuses a parameter
    // its action does not take, and an omitted optional one is simply empty.
    actions:d.actions.map(a=>{
      const o={type:a.type};
      (words.actions[a.type]||[]).forEach(p=>{
        const v=a[p];
        if(v===undefined||v===""||v===null)return;
        o[p]=(p==="route_id")?Number(v):v;
      });
      return o;
    })
  };
  try{
    if(editing.id)await api("/api/v1/rules/"+editing.id,{method:"PUT",body:JSON.stringify(body)});
    else await api("/api/v1/rules",{method:"POST",body:JSON.stringify(body)});
    editing=null;toast(t("Rule saved"));await render();
  }catch(e){
    if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}
    setErr("err_ruleedit",e.message);
  }
}

async function applyRestart(){
  setErr("err_portapply","");
  if(!confirm(t("Restart the server's services now? Connections in progress are dropped, and this browser session ends with them.")))return;
  try{await api("/api/v1/server/reinitialize",{method:"POST"});}
  catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_portapply",e.message);return;}
  toast(t("Restarting the services…"));
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  // The listener stops and starts with the rest of the services, and it drops
  // every browser session as it goes, so what is waited for is this page coming
  // back at all - asked for without a credential, because a request the server
  // answers 401 is a request that puts the browser's own password box on the
  // screen. When it answers, the session this page held is gone with the
  // listener that held it, and the sign-in card says so.
  for(let attempt=0;attempt<60;attempt++){
    await new Promise(r=>setTimeout(r,1000));
    let res=null;
    try{res=await fetch("/",{credentials:"omit",cache:"no-store"});}catch(_){continue;}
    if(res.status===200){signedOut(t("The services restarted, which ended this session. Sign in again."));return;}
  }
  signedOut(t("The server did not answer after the restart. Sign in again when it is back."));
}

/* ---------- IP ranges ----------
   Access control: which addresses may connect and what they may do. The form
   is built from the schema of POST /api/v1/ipranges, which names every field
   with its type, and drawn in the groups the desktop dialog uses - General,
   Connections, Relaying, Require auth, Protection - with a key the document
   gains later falling into a group of its own rather than out of sight. The
   document gives the keys no wording, so the captions here are the desktop
   dialog's. A new range starts where the create handler puts a key left out;
   the document does not state those defaults, so they are here, with the
   desktop's 15 for the priority (the handler's 0 would lose to every range
   there is). expires and expires_time are the expiry the auto-ban gives its
   ranges and the desktop dialog offers: a range that expires is removed once
   its time passes, and the time goes only with the flag. */
const RANGE_GROUPS=[
  {title:K("General"),keys:["name","lower","upper","priority"]},
  {title:K("Connections"),keys:["allow_smtp","allow_imap","allow_pop3"]},
  {title:K("Relaying"),keys:["deliver_local_to_local","deliver_local_to_remote","deliver_remote_to_local","deliver_remote_to_remote"]},
  {title:K("Require auth"),keys:["require_auth_local_to_local","require_auth_local_to_remote","require_auth_remote_to_local","require_auth_remote_to_remote","require_tls_for_auth"]},
  {title:K("Protection"),keys:["spam_protection","virus_protection"]},
  {title:K("Expiry"),keys:["expires","expires_time"]}
];
const RANGE_HINTS={
  name:K("A name for the range."),lower:K("The lowest address of the range, IPv4 or IPv6."),upper:K("The highest address of the range."),
  priority:K("Higher wins when ranges overlap."),
  allow_smtp:K("Allow SMTP connections from the range."),allow_imap:K("Allow IMAP connections."),allow_pop3:K("Allow POP3 connections."),
  deliver_local_to_local:K("Local sender to local recipient."),deliver_local_to_remote:K("Local sender to external recipient (relay out)."),
  deliver_remote_to_local:K("External sender to local recipient (incoming mail)."),deliver_remote_to_remote:K("External sender to external recipient - an open relay unless authentication is required."),
  require_auth_local_to_local:K("Require SMTP authentication for local to local."),require_auth_local_to_remote:K("Require SMTP authentication for local to external."),
  require_auth_remote_to_local:K("Require SMTP authentication for external to local."),require_auth_remote_to_remote:K("Require SMTP authentication for external to external."),
  require_tls_for_auth:K("Require SSL/TLS when authenticating."),
  spam_protection:K("Run the anti-spam checks on mail from this range."),virus_protection:K("Run the anti-virus scan on mail from this range."),
  expires:K("Remove the range once the time below passes, as one the auto-ban placed is removed."),
  expires_time:K("YYYY-MM-DD HH:MM:SS on the server's clock, or a date alone for midnight; required when the range expires, and taken only then.")
};
const RANGE_DEFAULTS={priority:15,expires:false,allow_smtp:true,allow_imap:true,allow_pop3:true,
  deliver_local_to_local:true,deliver_local_to_remote:false,deliver_remote_to_local:true,deliver_remote_to_remote:false,
  require_auth_local_to_local:false,require_auth_local_to_remote:true,require_auth_remote_to_local:false,require_auth_remote_to_remote:true,
  require_tls_for_auth:false,spam_protection:true,virus_protection:true};

  Object.keys(props).forEach(k=>{out[k]=Object.assign({},props[k]);if(!out[k].description&&RANGE_HINTS[k])out[k].description=RANGE_HINTS[k];});

/* ---------- Fetch accounts ----------

function fetchProps(){

/* ---------- Lists ----------
   The seven small collections the desktop edits in its collection editors,
   each a resource of the same shape - a listing and a create at its path, an
   update and a delete at /{id} - drawn from one description: the DNS
   blacklists, the SURBL servers, the anti-spam white list, the blocked
   senders, the blocked attachments, the greylisting white list and the
   incoming relays. Each is a table of the entry's own keys, with Edit and
   Delete on the row and Add below, and the editor is built from the schema
   of that collection's create, which types every key; a new entry starts at
   the defaults the create's description states, and at the desktop editor's
   where the description has none - a score of 5 for a DNS list, 100 for a
   blocked sender, *.exe for an attachment. Save posts a new entry and PUTs
   the whole record of an existing one by id, as the range editor does, then
   reads the collections again. The captions are the desktop editors'. Each
   collection carries its own sentences rather than a noun the sentences are
   built around, because a noun's gender and case change the sentence in most
   of the languages the page speaks. */

/* ---------- Reports ----------
   What happened on this server, per domain and per day. One request draws the
   whole page - GET /api/v1/reports/summary - because seven requests for seven
   tables of the same window is seven chances for them to disagree about what
   the window was.

   Every table is drawn from the server's own columns and rows rather than from
   a shape written here: the route answers a list of column names and a list of
   row objects, so a section that gains a column gains it in this page without
   an edit. The headings are looked up in REPORT_COLUMNS and shown in the
   server's own word when the table has no translation for one, which is the
   same rule the rest of this page follows for a value it did not write.

   The notes are the server's sentences, shown as they come. They are the part
   of a report that keeps it honest - "the message trace is switched off, so
   this section is empty" is not the same statement as an empty table, and a
   page that quietly drew the empty table would be lying by omission.

   The CSV is a link and not a button: it is the same route with format=csv, a
   same-origin navigation that carries the session cookie, so the file an
   administrator opens in a spreadsheet is written by the server from the very
   rows this page drew rather than by this page from what it happens to hold. */
const REPORT_SECTIONS=[
  {id:"traffic",title:K("Traffic"),chart:true},
  {id:"failures",title:K("Delivery failures")},
  {id:"senders",title:K("Top senders")},
  {id:"recipients",title:K("Top recipients")},
  {id:"mailboxes",title:K("Largest mailboxes")},
  {id:"volume",title:K("Volume")},
  {id:"storage",title:K("Storage"),chart:true}
];
const REPORT_COLUMNS={day:K("Day"),domain:K("Domain"),incoming:K("Incoming"),outgoing:K("Outgoing"),
  failed_incoming:K("Failed incoming"),failed_outgoing:K("Failed outgoing"),status:K("Status"),reason:K("Reason"),
  total:K("Total"),sender:K("Sender"),recipient:K("Recipient"),messages:K("Messages"),failed:K("Failed"),
  address:K("Address"),bytes:K("Bytes"),megabytes:K("Megabytes"),processed:K("Processed"),delivered:K("Delivered"),
  deferred:K("Deferred"),bounced:K("Bounced"),spam:K("Spam"),viruses:K("Viruses"),mailboxes:K("Mailboxes")};
let report={from:"",to:"",domain:"",top:10};
function reportQuery(extra){
  const parts=[];
  if(report.from)parts.push("from="+encodeURIComponent(report.from));
  if(report.to)parts.push("to="+encodeURIComponent(report.to));
  if(report.domain)parts.push("domain="+encodeURIComponent(report.domain));
  parts.push("top="+encodeURIComponent(report.top));
  if(extra)parts.push(extra);
  return parts.join("&");
}
/* A day string moved by whole days, in UTC, so that a browser in a zone with
   a daylight-saving change cannot turn "seven days back" into six or eight. */
function reportShiftDay(day,by){
  const parts=String(day||"").split("-");
  if(parts.length!==3)return day;
  const at=Date.UTC(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
  const moved=new Date(at+by*86400000);
  const pad=n=>(n<10?"0":"")+n;
  return moved.getUTCFullYear()+"-"+pad(moved.getUTCMonth()+1)+"-"+pad(moved.getUTCDate());
}
function reportColumnName(key){
  return REPORT_COLUMNS[key]?t(REPORT_COLUMNS[key]):key;
}
/* Grouped bars, drawn as SVG in the page itself: no library, nothing fetched,
   and a value under the pointer. A chart is here because a month of daily
   counts is the one thing in this report that a table genuinely does not
   show - the shape of it - and not because a chart is decorative. */
function reportChartHtml(labels,series){
  if(!labels.length)return "";
  const W=880,H=190,L=54,R=10,T=12,B=30;
  let max=0;
  series.forEach(s=>s.values.forEach(v=>{if(v>max)max=v;}));
  if(max<=0)max=1;
  const plotW=W-L-R,plotH=H-T-B;
  const group=plotW/labels.length,bw=Math.max(1.5,(group-4)/series.length);
  let bars="";
  labels.forEach((label,i)=>{
    series.forEach((s,j)=>{
      const value=Number(s.values[i])||0;
      const h=Math.max(value>0?1:0,Math.round(value/max*plotH));
      const x=L+i*group+2+j*bw,y=T+plotH-h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="'+h+'" fill="'+s.colour+'">'+
            '<title>'+escHtml(label+" "+t(s.label)+": "+value)+'</title></rect>';
    });
  });
  let ticks="";
  [0,Math.round(labels.length/2)-1,labels.length-1].forEach(i=>{
    if(i<0||i>=labels.length)return;
    ticks+='<text x="'+(L+i*group+group/2).toFixed(1)+'" y="'+(H-10)+'" font-size="10" fill="#8b949e" text-anchor="middle">'+escHtml(labels[i])+'</text>';
  });
  const legend=series.map(s=>'<span class="muted" style="margin-right:14px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+s.colour+';margin-right:6px"></span>'+escHtml(t(s.label))+'</span>').join("");
  return '<div class="tablewrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="'+escHtml(t("Messages per day"))+'">'+
    '<line x1="'+L+'" y1="'+(T+plotH)+'" x2="'+(W-R)+'" y2="'+(T+plotH)+'" stroke="#8b949e" stroke-width="0.5"></line>'+
    '<text x="'+(L-8)+'" y="'+(T+8)+'" font-size="10" fill="#8b949e" text-anchor="end">'+escHtml(String(max))+'</text>'+
    '<text x="'+(L-8)+'" y="'+(T+plotH)+'" font-size="10" fill="#8b949e" text-anchor="end">0</text>'+
    bars+ticks+'</svg></div><div class="row" style="margin-top:8px">'+legend+'</div>';
}
function reportSectionChart(id,answer){
  const rows=answer.rows||[];
  if(!rows.length)return "";
  if(id==="traffic"){
    /* One bar per day, so a domain picked apart across several rows of the same
       day is added up first - the chart is of the window, not of the rows. */
    const byDay={},order=[];
    rows.forEach(r=>{
      if(!byDay[r.day]){byDay[r.day]={i:0,o:0};order.push(r.day);}
      byDay[r.day].i+=Number(r.incoming)||0;
      byDay[r.day].o+=Number(r.outgoing)||0;
    });
    return reportChartHtml(order,[
      {label:K("Incoming"),colour:"#36c2ff",values:order.map(d=>byDay[d].i)},
      {label:K("Outgoing"),colour:"#7c5cff",values:order.map(d=>byDay[d].o)}
    ]);
  }
  return reportChartHtml(rows.map(r=>r.day),[
    {label:K("Megabytes"),colour:"#3fb950",values:rows.map(r=>Number(r.megabytes)||0)}
  ]);
}
function reportSectionHtml(section,answer){
  if(!answer)return "";
  const columns=answer.columns||[],rows=answer.rows||[];
  const head=columns.map(c=>"<th>"+escHtml(reportColumnName(c))+"</th>").join("");
  const body=rows.map(r=>"<tr>"+columns.map(c=>"<td>"+escHtml(r[c]===undefined||r[c]===null?"—":r[c])+"</td>").join("")+"</tr>").join("");
  const badge=answer.enabled?"":'<span class="badge warn">'+t("Not recorded")+"</span>";
  const truncated=answer.truncated?'<span class="badge warn">'+t("Partial")+"</span>":"";
  const csv="/api/v1/reports/"+encodeURIComponent(section.id)+"?"+reportQuery("format=csv");
  return '<div class="sect"><h2>'+escHtml(t(section.title))+' <code class="muted">GET /api/v1/reports/'+escHtml(section.id)+"</code> "+badge+truncated+
    '<span class="sp"></span><a class="btn ghost sm" id="csv_'+escHtml(section.id)+'" href="'+escHtml(csv)+'" download>'+t("CSV")+"</a></h2>"+
    '<div class="card flat"><p class="note">'+escHtml(answer.note||"")+"</p>"+
    (section.chart?reportSectionChart(section.id,answer):"")+
    '<div class="tablewrap"><table><thead><tr>'+head+"</tr></thead><tbody>"+
    (body||'<tr><td colspan="'+Math.max(1,columns.length)+'" class="empty">'+t("Nothing in this range.")+"</td></tr>")+
    "</tbody></table></div></div></div>";
}
async function renderReports(){
  const index=await api("/api/v1/reports");
  if(!report.to){report.from=index.from;report.to=index.to;}
  cache.domains=asList(await api("/api/v1/domains"),"domains");
  const answer=await api("/api/v1/reports/summary?"+reportQuery());
  const sections=answer.sections||{};
  const omitted=(answer.omitted||[]).map(o=>"<li>"+escHtml(o.section+" — "+o.reason)+"</li>").join("");
  const notAnswerable=(index.not_answerable||[]).map(s=>"<li>"+escHtml(s)+"</li>").join("");
  const sources=index.sources||{};
  const sourceRow=(name,key)=>{
    const s=sources[key]||{};
    return "<tr><td>"+escHtml(name)+"</td><td>"+(s.enabled?'<span class="badge good">'+t("Active")+"</span>":'<span class="badge warn">'+t("Not recorded")+"</span>")+
      "</td><td>"+escHtml(s.retention_days?String(s.retention_days):"—")+"</td><td>"+escHtml(s.oldest||"—")+"</td></tr>";
  };
  const domainOptions='<option value="">'+t("All domains")+"</option>"+
    cache.domains.map(d=>'<option value="'+escHtml(d.name)+'"'+(d.name===report.domain?" selected":"")+">"+escHtml(d.name)+"</option>").join("");
  $("#content").innerHTML='<div class="view">'+
    '<div class="card flat"><div class="row">'+
      "<label>"+t("From")+' <input id="repFrom" type="date" value="'+escHtml(report.from||"")+'"></label>'+
      "<label>"+t("To")+' <input id="repTo" type="date" value="'+escHtml(report.to||"")+'"></label>'+
      "<label>"+t("Domain")+' <select id="repDomain">'+domainOptions+"</select></label>"+
      "<label>"+t("Rows")+' <input id="repTop" type="number" min="1" max="200" value="'+escHtml(String(report.top))+'"></label>'+
      '<button class="btn" data-act="repshow">'+t("Show")+"</button>"+
      '<button class="btn ghost sm" data-act="repdays" data-days="7">'+t("Last 7 days")+"</button>"+
      '<button class="btn ghost sm" data-act="repdays" data-days="30">'+t("Last 30 days")+"</button>"+
      '<button class="btn ghost sm" data-act="repdays" data-days="90">'+t("Last 90 days")+"</button>"+
      '<div class="err" id="err_reports"></div></div></div>'+
    '<div class="sect"><h2>'+t("What this server keeps")+' <code class="muted">GET /api/v1/reports</code></h2>'+
      '<div class="card flat"><div class="tablewrap"><table><thead><tr><th>'+t("Source")+"</th><th>"+t("Status")+"</th><th>"+
      t("Retention")+"</th><th>"+t("Oldest")+"</th></tr></thead><tbody>"+
      sourceRow(t("Message trace"),"message_trace")+sourceRow(t("Metric history"),"metric_history")+sourceRow(t("Message store"),"message_store")+
      "</tbody></table></div>"+
      '<p class="note" style="margin-top:14px"><b>'+t("What cannot be answered")+"</b></p><ul class=\"note\">"+notAnswerable+omitted+"</ul></div></div>"+
    REPORT_SECTIONS.map(s=>reportSectionHtml(s,sections[s.id])).join("")+
    "</div>";
}
function reportShow(){
  const from=document.getElementById("repFrom"),to=document.getElementById("repTo");
  const domain=document.getElementById("repDomain"),top=document.getElementById("repTop");
  if(from)report.from=from.value;
  if(to)report.to=to.value;
  if(domain)report.domain=domain.value;
  if(top){const n=Number(top.value);report.top=n>=1&&n<=200?Math.round(n):10;}
  render();
}
function reportLastDays(days){
  report.to=report.to||"";
  report.from=reportShiftDay(report.to,-(Number(days)-1));
  render();
}

/* ---------- Logs ---------- */
async function renderLogs(){
  const files=asList(await api("/api/v1/logs"),"files");
  const rows=files.map(f=>`
    <tr><td>${escHtml(f.name)}</td><td>${escHtml(fmtBytes(f.size))}</td><td>${escHtml(f.created||"—")}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-act="log" data-name="${escHtml(f.name)}" data-lines="200">${t("Last 200")}</button>
        <button class="btn ghost sm" data-act="log" data-name="${escHtml(f.name)}" data-lines="2000">${t("Last 2000")}</button></td></tr>`).join("");
  $("#content").innerHTML=`<div class="card view">
    <div class="tablewrap"><table><thead><tr><th>${t("Log file")}</th><th>${t("Size")}</th><th>${t("Created")}</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="4" class="empty">'+t("No log files. Logging may be off, or the folder is empty.")+'</td></tr>'}</tbody></table></div>
    <div class="err" id="err_log" style="margin-top:10px"></div>
    <pre id="logPre" style="margin-top:14px;max-height:60vh;overflow:auto;white-space:pre-wrap" hidden></pre></div>`;
}
function fmtBytes(n){n=Number(n)||0;if(n>=1048576)return (n/1048576).toFixed(1)+" MB";if(n>=1024)return (n/1024).toFixed(1)+" KB";return n+" B";}
/* ---------- Audit trail ----------
   Who changed what, when, from where, and over which interface. The rows are
   written below the interfaces (see AuditTrail.h in the server), so a change
   made over COM by the Control Panel and the same change made here appear side
   by side with only the interface column telling them apart.

   The page reads and never writes: the record is append-only, and a page that
   could edit it would be the first thing to use. */
let auditOffset=0;
const AUDIT_PAGE=50;
function auditWhen(seconds){
  const value=Number(seconds)||0;
  if(!value)return "—";
  return new Date(value*1000).toISOString().replace("T"," ").replace(/\.\d+Z$/,"Z");
}
async function renderAudit(){
  const filter=(auditFilter||"").trim();
  const query="?limit="+AUDIT_PAGE+"&offset="+auditOffset+(filter?"&actor="+encodeURIComponent(filter):"");
  const answer=await api("/api/v1/audit"+query);
  const entries=answer.entries||[];
  const total=Number(answer.total)||0;
  const rows=entries.map(e=>`
    <tr><td>${escHtml(auditWhen(e.time))}</td><td>${escHtml(e.actor||"—")}</td><td>${escHtml(e.interface||"—")}</td>
        <td>${escHtml(e.address||"—")}</td><td>${escHtml(e.object_type||"—")}</td><td>${escHtml(e.object||"—")}</td>
        <td>${escHtml(e.action||"—")}</td><td>${escHtml(e.detail||"")}</td></tr>`).join("");
  $("#content").innerHTML=`<div class="card view">
    <div class="row" style="gap:10px;align-items:center;margin-bottom:12px">
      <input id="auditFilter" placeholder="${t("Filter by administrator or API key")}" value="${escHtml(filter)}" style="flex:1">
      <button class="btn ghost sm" data-act="auditverify">${t("Verify the chain")}</button>
      <button class="btn ghost sm" data-act="auditpage" data-by="-${AUDIT_PAGE}">${t("Newer")}</button>
      <button class="btn ghost sm" data-act="auditpage" data-by="${AUDIT_PAGE}">${t("Older")}</button>
    </div>
    <div class="err" id="err_audit"></div>
    <div class="tablewrap"><table><thead><tr><th>${t("When")}</th><th>${t("Who")}</th><th>${t("Interface")}</th><th>${t("From")}</th>
      <th>${t("Object")}</th><th>${t("Name")}</th><th>${t("Action")}</th><th>${t("Detail")}</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" class="empty">'+t("Nothing has been recorded yet. Every administrative change appears here.")+'</td></tr>'}</tbody></table></div>
    <p class="note" style="margin-top:12px">${tf("{0} to {1} of {2}",total?auditOffset+1:0,auditOffset+entries.length,total)}</p></div>`;
  const box=$("#auditFilter");
  if(box)box.onchange=e=>{auditFilter=e.target.value;auditOffset=0;render();};
}
let auditFilter="";
async function verifyAuditChain(){
  setErr("err_audit","");
  try{
    const answer=await api("/api/v1/audit/verify");
    if(answer.intact)toast(tf("The chain is intact. {0} row(s) checked.",Number(answer.rows_checked)||0));
    else setErr("err_audit",tf("The chain is broken at row {0}. {1}",Number(answer.first_broken_id)||0,answer.reason||""));
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_audit",e.message);}
}
async function showLog(name,lines){
  setErr("err_log","");
  try{
    const answer=await api("/api/v1/logs/"+encodeURIComponent(name)+"?lines="+encodeURIComponent(lines||200));
    const pre=$("#logPre");if(!pre)return;
    pre.hidden=false;
    pre.textContent=(answer.lines||[]).join("\n")||t("(empty)");
    pre.scrollTop=pre.scrollHeight;
  }catch(e){if(e.message==="auth"){signedOut(t("The session ended. Sign in again."));return;}setErr("err_log",tf("Could not read {0}: {1}",name,e.message));}
}

/* ---------- Boot ----------
   No credential is stored, so the only question at load is whether the browser
   still holds a live session cookie - and that is asked only when this tab has
   signed in before. Asking unconditionally would mean a request answered 401 on
   every first visit, and a 401 from this API carries WWW-Authenticate: Basic,
   which is the browser's cue to put its own password box on the screen in front
   of the page's. */
let resumed=false;
try{resumed=sessionStorage.getItem("hmsSession")==="1";}catch(_){}
if(resumed)api("/api/v1/status").then(enter).catch(()=>{signedOut(t("The session ended. Sign in again."));});
/* The language: the one this browser remembers, else the browser's own. English
   is the page as it stands and asks the server for nothing. */
let rememberedLanguage=null;
try{rememberedLanguage=knownLanguage(localStorage.getItem("hmsLang"));}catch(_){}
loadLanguage(rememberedLanguage||browserLanguage());
</script>
