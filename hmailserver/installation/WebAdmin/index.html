<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hMailServer — Control Deck</title>
<style>
:root{
  --bg:#070b12; --bg2:#0b1018; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09); --text:#e6edf3; --muted:#8b949e;
  --accent:#36c2ff; --accent2:#7c5cff; --good:#3fb950; --warn:#d29922; --bad:#f85149;
  --glow:0 0 24px rgba(54,194,255,.25);
  --radius:14px; --font:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Mono',Consolas,'SFMono-Regular',monospace;
}
[data-theme="light"]{
  --bg:#eef2f7; --bg2:#f7fafc; --surface:rgba(255,255,255,.75); --surface2:rgba(255,255,255,.95);
  --border:rgba(15,30,50,.12); --text:#1c2530; --muted:#5a6877;
  --accent:#0969da; --accent2:#6f42c1; --glow:0 4px 18px rgba(9,105,218,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}

/* Animated aurora backdrop */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;filter:blur(90px)}
.aurora::before,.aurora::after{content:"";position:absolute;width:55vw;height:55vw;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0%,transparent 60%);animation:drift 26s ease-in-out infinite}
.aurora::after{background:radial-gradient(circle,var(--accent2) 0%,transparent 60%);
  right:-10vw;bottom:-18vw;animation-delay:-13s}
.aurora::before{left:-12vw;top:-18vw}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,5vh) scale(1.15)}}

.app{position:relative;z-index:1;display:flex;height:100%}

/* ---------- Sidebar ---------- */
.side{width:232px;display:flex;flex-direction:column;padding:20px 14px;gap:4px;
  background:linear-gradient(180deg,var(--surface),transparent);border-right:1px solid var(--border);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px}
.brand .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--glow)}
.brand b{font-size:15px;letter-spacing:.4px}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--muted);font-size:13.5px;cursor:pointer;transition:all .18s}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(54,194,255,.16),transparent);color:var(--text);
  box-shadow:inset 2.5px 0 0 var(--accent)}
.nav .ico{width:17px;text-align:center;opacity:.9}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.pill{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--border)}
.topbar h1{font-size:18px;font-weight:600;letter-spacing:.3px}
.topbar .sp{flex:1}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);transition:all .18s;font-size:15px}
.iconbtn:hover{border-color:var(--accent);box-shadow:var(--glow)}
.content{flex:1;overflow:auto;padding:26px 28px}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;backdrop-filter:blur(14px);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:rgba(54,194,255,.4);box-shadow:var(--glow)}
.card.flat:hover{transform:none;border-color:var(--border);box-shadow:none}
.kpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpi .l{color:var(--muted);font-size:12px;margin-top:6px;letter-spacing:.6px;text-transform:uppercase}
.kpi .bar{height:3px;border-radius:2px;margin-top:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.7}

.sect{margin-top:26px}
.sect h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sect h2 code{text-transform:none;letter-spacing:0}
.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:12px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--muted);text-align:left;font-weight:500;font-size:11.5px;text-transform:uppercase;
  letter-spacing:1px;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tr{transition:background .15s}
tbody tr:hover{background:var(--surface2)}
.tablewrap{overflow-x:auto}

.btn{all:unset;cursor:pointer;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:all .18s;letter-spacing:.3px}
.btn:hover{box-shadow:var(--glow);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:linear-gradient(135deg,#f85149,#c93c54)}
.btn.sm{padding:5px 11px;font-size:12px}

input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);
  padding:9px 13px;font-size:13.5px;font-family:var(--font);outline:none;transition:all .18s;max-width:100%}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);padding:0}
option{background:var(--bg2);color:var(--text)}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.4px}
.badge.good{background:rgba(63,185,80,.15);color:var(--good)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--warn)}
.badge.info{background:rgba(54,194,255,.15);color:var(--accent)}

.empty{color:var(--muted);padding:34px;text-align:center;font-size:13.5px}
pre{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:12px;
  overflow:auto;line-height:1.7;color:var(--text)}
.toast{position:fixed;bottom:26px;right:26px;background:var(--surface2);border:1px solid var(--accent);
  border-radius:12px;padding:13px 20px;font-size:13.5px;backdrop-filter:blur(16px);box-shadow:var(--glow);
  opacity:0;transform:translateY(12px);transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* ---------- Forms built from the OpenAPI document ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:minmax(210px,1fr) minmax(210px,1.1fr);gap:8px 20px;
  padding:11px 0;border-bottom:1px solid var(--border);align-items:start}
.fr:last-child{border-bottom:none}
.fr .lab b{font-size:13.5px;font-weight:600;display:inline-block;margin-right:8px}
.fr .lab code{color:var(--muted)}
.hint{color:var(--muted);font-size:11.5px;line-height:1.5}
.fr .hint{margin-top:4px}
.fr .ctl input[type=text],.fr .ctl input[type=password],.fr .ctl input[type=number],.fr .ctl select{width:100%}
.fr .ctl .ro{display:inline-block;padding:8px 0;word-break:break-all}
.erow{padding:9px 0;border-bottom:1px dashed var(--border);align-items:flex-start}
.erow:last-of-type{border-bottom:none}
.err{color:var(--bad);font-size:12.5px;line-height:1.5}
.err:empty{display:none}
.note{color:var(--muted);font-size:12.5px;line-height:1.6;margin-bottom:14px}

/* ---------- Login ---------- */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg)}
.gate .aurora{opacity:.6}
.login{position:relative;width:380px;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:38px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.login .logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:21px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--glow);margin-bottom:18px}
.login h1{font-size:20px;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login input{width:100%;margin-bottom:12px}
.login .btn{width:100%;text-align:center;padding:11px;margin-top:6px;box-sizing:border-box}
.login .err{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:10px}
.view{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
</style>
</head>
<body data-theme="dark">
<div class="aurora"></div>

<!-- Login gate -->
<div class="gate" id="gate">
  <div class="aurora"></div>
  <form class="login" id="loginForm">
    <div class="logo">hM</div>
    <h1>Control Deck</h1>
    <p>Sign in with the hMailServer administrator credential. The password is exchanged once for a session cookie and is never kept by this page.</p>
    <input id="user" placeholder="Username" value="Administrator" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <input id="otp" placeholder="One-time code" inputmode="numeric" autocomplete="one-time-code" hidden>
    <button class="btn" type="submit">Connect</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- App shell -->
<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">
      <div class="logo">hM</div>
      <div><b>hMailServer</b><small>Control Deck</small></div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dash" class="on"><span class="ico">◈</span>Dashboard</button>
      <button data-view="domains"><span class="ico">⌂</span>Domains</button>
      <button data-view="queue"><span class="ico">⇶</span>Delivery queue</button>
      <button data-view="tlsa"><span class="ico">⛨</span>DANE / TLSA</button>
      <button data-view="settings"><span class="ico">⚙</span>Settings</button>
      <button data-view="rules"><span class="ico">⚖</span>Rules</button>
      <button data-view="routes"><span class="ico">⇥</span>Routes</button>
      <button data-view="certs"><span class="ico">⚿</span>Certificates</button>
      <button data-view="ports"><span class="ico">⊞</span>Ports</button>
      <button data-view="logs"><span class="ico">≡</span>Logs</button>
    </nav>
    <div class="foot">
      <div class="pill"><span class="dot"></span><span id="connState">Connected</span></div>
      <div class="pill" style="opacity:.7">v<span id="ver">—</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="viewTitle">Dashboard</h1>
      <div class="sp"></div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
      <button class="iconbtn" id="logoutBtn" title="Sign out">⏻</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
let view="dash", pollTimer=null;

/* The server's own OpenAPI document, fetched once per sign-in. Every form on
   this page - which keys a settings group has, what type each one is, which
   words an enumeration takes, which key is write-only and which is read-only -
   is built from it, so a key added to the API appears here without this file
   being touched. */
let spec=null;

/* The last listing each view read, so that an editor can be opened on a row
   without asking again. Never written to instead of re-reading: every write is
   followed by a fresh GET. */
const cache={certificates:[],ports:[],routes:[],rules:[]};

/* The editor a view has open, if any: {kind, id, values} - id 0 is a new one. */
let editing=null;

/* Per settings group: the schema it was built from and the values it was built
   with, so that Save can send only what changed. */
const settingsState={};

/* ---------- API ----------
   One entry point for every request. A write carries X-Requested-With, which
   is what the server demands of a request authenticated by the session cookie
   (its own cross-site protection, on top of the cookie's SameSite=Strict), and
   the cookie itself travels because the request is same-origin. Nothing here
   holds a credential: after sign-in the page has no secret at all. */
async function api(path,opts){
  opts=opts||{};
  const method=(opts.method||"GET").toUpperCase();
  const headers=Object.assign({},opts.headers||{});
  if(method!=="GET"&&method!=="HEAD")headers["X-Requested-With"]="hMailServer";
  if(opts.body!==undefined)headers["Content-Type"]="application/json";
  const res=await fetch(path,{method:method,body:opts.body,headers:headers,credentials:"same-origin"});
  if(res.status===401)throw new Error("auth");
  if(!res.ok){
    // A refused request answers {"error":"<a sentence written for the administrator>"};
    // that sentence is the message, and it is what the page shows beside the
    // control that caused it. The whole exchange goes to the console for diagnosis.
    let body="";
    try{body=await res.text();}catch(_){}
    let message="";
    try{message=String(JSON.parse(body).error||"");}catch(_){}
    console.error("API request failed",{path:path,status:res.status,body:body});
    const err=new Error(message||("HTTP "+res.status));
    err.status=res.status;
    throw err;
  }
  const text=await res.text();
  return text?JSON.parse(text):{};
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

/* Server-provided values (domain names, addresses, queue entries, TLSA records,
   and every word of the OpenAPI document) are rendered into HTML, so every one
   of them goes through this first. */
function escHtml(v){
  return String(v===undefined||v===null?"":v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
/* The server's sentence, shown where the request came from. */
function setErr(id,message){const e=document.getElementById(id);if(e)e.textContent=message||"";}
function asList(x,key){return Array.isArray(x)?x:((x&&x[key])||[]);}

/* ---------- Theme ---------- */
const savedTheme=localStorage.getItem("hmsTheme")||"dark";
document.body.dataset.theme=savedTheme;
$("#themeBtn").onclick=()=>{
  const next=document.body.dataset.theme==="dark"?"light":"dark";
  document.body.dataset.theme=next;localStorage.setItem("hmsTheme",next);
};

/* ---------- Sign in, sign out ----------
   The password is presented once, to POST /api/v1/session, and the server
   answers with an HttpOnly cookie; the page never reads it and never stores a
   credential of its own. When a second factor is enrolled on the administrator
   credential the server answers 401 with second_factor "required", and the
   code field appears. */
function basicCredential(user,password){
  return "Basic "+btoa(unescape(encodeURIComponent(user+":"+password)));
}
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();
  const code=$("#otp").value.trim();
  const headers={"Authorization":basicCredential($("#user").value,$("#pass").value),
                 "X-Requested-With":"hMailServer"};
  if(code)headers["X-hMailServer-OTP"]=code;
  $("#loginErr").textContent="";
  let res;
  try{res=await fetch("/api/v1/session",{method:"POST",headers:headers,credentials:"same-origin"});}
  catch(_){$("#loginErr").textContent="Could not reach the server.";return;}
  let body={};
  try{body=JSON.parse(await res.text());}catch(_){}
  if(res.status===201){
    $("#pass").value="";$("#otp").value="";$("#otp").hidden=true;
    // Not a credential and not a secret: a mark saying this tab has a session,
    // so that a reload asks the server whether it is still live instead of
    // showing the sign-in card over a working session. A first visit sets
    // nothing, and so never makes a request the server answers 401 - which is
    // what would put the browser's own password box on the screen.
    try{sessionStorage.setItem("hmsSession","1");}catch(_){}
    try{enter(await api("/api/v1/status"));}
    catch(err){$("#loginErr").textContent="Signed in, but the server did not answer: "+err.message;}
    return;
  }
  if(res.status===401&&(body.second_factor==="required"||res.headers.get("X-hMailServer-OTP")==="required")){
    $("#otp").hidden=false;$("#otp").focus();
    $("#loginErr").textContent="A one-time code is needed. Enter the code from your authenticator app.";
    return;
  }
  $("#loginErr").textContent=body.error?body.error:"Authentication failed. Check the password.";
};
$("#logoutBtn").onclick=async()=>{
  try{await api("/api/v1/session",{method:"DELETE"});}catch(_){}
  signedOut("Signed out.");
};
function signedOut(message){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  spec=null;editing=null;
  try{sessionStorage.removeItem("hmsSession");}catch(_){}
  $("#app").style.display="none";
  $("#gate").style.display="grid";
  $("#loginErr").textContent=message||"";
  $("#pass").focus();
}
function enter(status){
  $("#gate").style.display="none";$("#app").style.display="flex";
  $("#ver").textContent=status.version||"?";
  render();
  if(!pollTimer)pollTimer=setInterval(()=>{if(view==="dash")render(true);},3000);
}

/* ---------- Navigation ---------- */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  view=b.dataset.view;editing=null;render();
});
const titles={dash:"Dashboard",domains:"Domains",queue:"Delivery queue",tlsa:"DANE / TLSA",settings:"Settings",
  rules:"Rules",routes:"Routes",certs:"Certificates",ports:"Ports",logs:"Logs"};

async function render(silent){
  $("#viewTitle").textContent=titles[view];
  try{
    if(view==="dash")await renderDash(silent);
    else if(view==="domains")await renderDomains();
    else if(view==="queue")await renderQueue();
    else if(view==="tlsa")await renderTlsa();
    else if(view==="settings")await renderSettings();
    else if(view==="rules")await renderRules();
    else if(view==="routes")await renderRoutes();
    else if(view==="certs")await renderCerts();
    else if(view==="ports")await renderPorts();
    else if(view==="logs")await renderLogs();
    $("#connState").textContent="Connected";
  }catch(err){
    if(err.message==="auth"){signedOut("The session ended. Sign in again.");return;}
    $("#connState").textContent="Connection problem";
    if(!silent)$("#content").innerHTML='<div class="empty">Could not reach the server: '+escHtml(err.message)+'</div>';
  }
}

/* Buttons inside a rendered view carry their arguments as data attributes and are
   handled here, so no server-provided value is ever placed inside inline JavaScript,
   where an HTML entity in an account address would be decoded before the handler
   is parsed. */
$("#content").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;
  const d=b.dataset;
  if(d.act==="accounts")showAccounts(d.domain);
  else if(d.act==="domains")render();
  else if(d.act==="add")addAccount(d.domain);
  else if(d.act==="del")delAccount(d.address,d.domain);
  else if(d.act==="retry")retryMsg(d.id);
  else if(d.act==="delmsg")delMsg(d.id);
  else if(d.act==="log")showLog(d.name,d.lines);
  else if(d.act==="copy")navigator.clipboard.writeText($("#tlsaPre").textContent).then(()=>toast("Copied to clipboard"));
  else if(d.act==="setsave")saveSettings(d.group);
  else if(d.act==="rulenew")openRule(0);
  else if(d.act==="ruleedit")openRule(Number(d.id));
  else if(d.act==="ruledel")deleteRule(Number(d.id),d.name);
  else if(d.act==="rulesave")saveRule();
  else if(d.act==="critadd"){readRuleForm();editing.rule.criteria.push({field:"subject",header:"",match:"contains",value:""});renderRuleEditor();}
  else if(d.act==="critdel"){readRuleForm();editing.rule.criteria.splice(Number(d.i),1);renderRuleEditor();}
  else if(d.act==="actadd"){readRuleForm();editing.rule.actions.push({type:ruleWords().types[0]||"delete"});renderRuleEditor();}
  else if(d.act==="actdel"){readRuleForm();editing.rule.actions.splice(Number(d.i),1);renderRuleEditor();}
  else if(d.act==="certadd")addCertificate();
  else if(d.act==="certdel")deleteCertificate(Number(d.id),d.name);
  else if(d.act==="portnew")openPort(0);
  else if(d.act==="portedit")openPort(Number(d.id));
  else if(d.act==="portdel")deletePort(Number(d.id),d.label);
  else if(d.act==="portsave")savePort();
  else if(d.act==="portapply")applyRestart();
  else if(d.act==="routenew")openRoute(0);
  else if(d.act==="routeedit")openRoute(Number(d.id));
  else if(d.act==="routedel")deleteRoute(Number(d.id),d.name);
  else if(d.act==="routesave")saveRoute();
  else if(d.act==="cancel"){editing=null;render();}
});
/* A criterion's field or an action's type decides which further controls the
   row has, so those two selects redraw the editor. */
$("#content").addEventListener("change",e=>{
  const el=e.target.closest("[data-r]");if(!el)return;
  if(el.dataset.r==="crit-field"||el.dataset.r==="act-type"){readRuleForm();renderRuleEditor();}

/* ---------- The OpenAPI document ---------- */
async function loadSpec(){
  if(!spec)spec=await api("/api/v1/openapi.json");
  return spec;
}
function operation(path,method){
  const p=((spec||{}).paths||{})[path];
  return (p&&p[method])||{};
}
function bodySchema(path,method){
  const c=((operation(path,method).requestBody||{}).content||{})["application/json"]||{};
  return c.schema||{};
}
function properties(path,method){return bodySchema(path,method).properties||{};}
function requiredOf(path,method){return bodySchema(path,method).required||[];}
/* The sentences of a description that mention a word, so that what the page
   tells the administrator about (say) restarting is the server's own wording
   and not a copy of it that can drift. */
function sentencesWith(text,word){
  return String(text||"").split(". ")
    .filter(s=>s.toLowerCase().indexOf(word)>=0)
    .map(s=>s.replace(/\.$/,"")+".").join(" ");
}
/* The defaults a create route states in prose - "all_addresses (default true)"
   for a route, "connection_security to none" for a port - so that a new record's
   form starts where the server would put it rather than at blank and false. A
   key the description does not mention simply keeps the empty control. */
function documentedDefaults(path,method,props){
  const text=operation(path,method).description||"";
  const out={};
  Object.keys(props).forEach(key=>{
    // The gap between the key and its "(default …)" may name the key's other
    // spelling but must not cross a bracket: without that, "addresses (an array
    // of e-mail addresses) and connection_security (default none)" hands the
    // address list the word "none".
    const parenthesised=new RegExp("\\b"+key+"\\b[^.;()]{0,40}?\\(default ([^),]*)[),]").exec(text);
    const prose=new RegExp("\\b"+key+"\\b (?:defaults to|to) ([A-Za-z0-9_.:]+)").exec(text);
    const match=parenthesised||prose;
    if(!match)return;
    const raw=String(match[1]).trim();
    const type=props[key].type||"string";
    if(type==="boolean"){if(raw==="true"||raw==="false")out[key]=raw==="true";return;}
    if(type==="integer"){const n=Number(raw);if(isFinite(n))out[key]=n;return;}
    out[key]=raw;
  });
  return out;
}

/* ---------- Building a control from a schema property ---------- */
const ACRONYMS={smtp:"SMTP",imap:"IMAP",pop3:"POP3",tls:"TLS",ssl:"SSL",starttls:"STARTTLS",sasl:"SASL",
  acl:"ACL",ip:"IP",ipv6:"IPv6",kb:"KB",mb:"MB",mx:"MX",ptr:"PTR",spf:"SPF",dkim:"DKIM",dmarc:"DMARC",arc:"ARC",
  dane:"DANE",tlsa:"TLSA",ca:"CA",id:"ID",url:"URL",tcpip:"TCP/IP",csa:"CSA",sql:"SQL",dns:"DNS",helo:"HELO"};
function humanise(key){
  const words=String(key).split("_");
  return words.map((w,i)=>ACRONYMS[w]||(i===0?w.charAt(0).toUpperCase()+w.slice(1):w)).join(" ");
}
function optionsHtml(values,selected){
  return values.map(v=>{
    const value=(v&&typeof v==="object")?v.value:v;
    const label=(v&&typeof v==="object")?v.label:humanise(v);
    return '<option value="'+escHtml(value)+'"'+(String(value)===String(selected===undefined?"":selected)?" selected":"")+'>'+escHtml(label)+'</option>';
  }).join("");
}
function isPassword(key,prop){return !!prop.writeOnly||/password$/.test(key);}
function controlHtml(prefix,key,prop,value,opts){
  const id=prefix+"_"+key;
  const type=prop.type||"string";
  if(prop.readOnly)
    return '<code class="ro">'+escHtml(value===undefined||value===null||value===""?"—":value)+'</code>';
  if(opts.choices&&opts.choices[key])
    return '<select id="'+id+'">'+optionsHtml(opts.choices[key],value)+'</select>';
  if(prop["enum"])
    return '<select id="'+id+'">'+optionsHtml(prop["enum"],value)+'</select>';
  if(type==="boolean")
    return '<input type="checkbox" id="'+id+'"'+(value?" checked":"")+'>';
  if(type==="integer")
    return '<input type="number" id="'+id+'" value="'+escHtml(value===undefined||value===null?"":value)+'">';
  if(type==="array")
    return '<textarea id="'+id+'" rows="4" placeholder="One per line">'+escHtml((Array.isArray(value)?value:[]).join("\n"))+'</textarea>';
  if(isPassword(key,prop))
    return '<input type="password" id="'+id+'" value="" autocomplete="new-password" placeholder="'+escHtml(opts.passwordHint||"left unchanged unless filled")+'">';
  return '<input type="text" id="'+id+'" value="'+escHtml(value===undefined||value===null?"":value)+'">';
}
function formHtml(prefix,props,values,opts){
  opts=opts||{};
  const required=opts.required||[];
  return Object.keys(props).map(key=>{
    if(opts.skip&&opts.skip.indexOf(key)>=0)return "";
    const prop=props[key];
    const value=values?values[key]:undefined;
    const caption=humanise(key);
    const description=prop.description||"";
    const restart=/takes effect when the server restarts/i.test(description);
    const flags=(required.indexOf(key)>=0?'<span class="badge info">required</span> ':"")+
                (prop.readOnly?'<span class="badge info">read-only</span> ':"")+
                (isPassword(key,prop)?'<span class="badge info">write-only</span> ':"")+
                (restart?'<span class="badge warn">restart</span>':"");
    const search=(key+" "+caption+" "+description).toLowerCase();
    return '<div class="fr" data-k="'+escHtml(search)+'">'+
             '<div class="lab"><b>'+escHtml(caption)+'</b><code>'+escHtml(key)+'</code> '+flags+
               (description?'<div class="hint">'+escHtml(description)+'</div>':"")+'</div>'+
             '<div class="ctl">'+controlHtml(prefix,key,prop,value,opts)+'</div>'+
           '</div>';
  }).join("");
}
/* Reads a form back into a plain object of the schema's types. An empty number
   is left out rather than sent as 0: on a create that lets the server apply its
   own default, and on a settings save it means "unchanged". */
function readForm(prefix,props,opts){
  opts=opts||{};
  const out={};
  Object.keys(props).forEach(key=>{
    const prop=props[key];
    if(prop.readOnly)return;
    if(opts.skip&&opts.skip.indexOf(key)>=0)return;
    const el=document.getElementById(prefix+"_"+key);
    if(!el)return;
    const type=prop.type||"string";
    if(isPassword(key,prop)){if(el.value!=="")out[key]=el.value;return;}
    if(type==="boolean"){out[key]=el.checked;return;}
    if(type==="integer"){
      const raw=String(el.value).trim();
      if(raw==="")return;
      const n=Number(raw);
      if(!isFinite(n)||Math.floor(n)!==n)throw new Error(humanise(key)+" must be a whole number.");
      out[key]=n;return;
    }
    if(type==="array"){out[key]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);return;}
    out[key]=el.value;
  });
  return out;
}

/* ---------- Dashboard ---------- */
function animateNum(el,target){
  const start=parseInt(el.dataset.v||"0",10),diff=target-start;if(!diff){el.textContent=target.toLocaleString();return}
  const t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(start+diff*e).toLocaleString();
    if(k<1)requestAnimationFrame(step);else el.dataset.v=target})(t0);
}

async function saveSettings(groupId){

/* ---------- Rules ----------
   The rule vocabulary - which words a criterion's field and its match take,
   which action types there are and what parameters each one carries - is in the
   OpenAPI document, but written as prose in the description of POST /api/v1/rules
   rather than as enumerations, so it is read out of that sentence here. The
   fallback below keeps the editor usable if the wording is ever reshaped; if it
   is being used, the document and this page have drifted apart and the document
   is the one to fix. */
const RULE_FALLBACK={
  fields:["from","to","cc","subject","body","message_size","recipient_list","delivery_attempts","header"],
  matches:["equals","not_equals","contains","not_contains","less_than","greater_than","regex","wildcard"],
  actions:{forward:["to"],reply:["from_name","from_address","subject","body"],move_to_folder:["folder"],
    script_function:["script_function"],set_header:["header","value"],send_using_route:["route_id"],
    bind_to_address:["value"],"delete":[],stop:[],copy:[]}
};
function ruleWords(){
  const text=operation("/api/v1/rules","post").description||"";
  const tokens=s=>String(s).split(/,| and /)
    .map(p=>{const m=/([a-z][a-z0-9_]*)/.exec(p.replace(/^\s*or\s+/,""));return m?m[1]:"";})
    .filter(Boolean);
  const inside=label=>{const m=new RegExp(label+"\\s*\\(([^)]*)\\)").exec(text);return m?tokens(m[1]):[];};
  const fields=inside("field"), matches=inside("match");
  const actions={};
  const m=/the parameters that type takes\s*-\s*([^.]*)\./.exec(text);
  if(m){
    m[1].split(";").forEach(segment=>{
      const colon=segment.indexOf(":");
      if(colon>=0){
        const type=tokens(segment.slice(0,colon))[0];
        if(type)actions[type]=tokens(segment.slice(colon+1));
      }else if(/takes? none/.test(segment)){
        tokens(segment.replace(/takes? none/,"")).forEach(t=>{actions[t]=[];});
      }
    });
  }
  const words={
    fields:fields.length?fields:RULE_FALLBACK.fields,
    matches:matches.length?matches:RULE_FALLBACK.matches,
    actions:Object.keys(actions).length?actions:RULE_FALLBACK.actions
  };
  words.types=Object.keys(words.actions);
  return words;
}

  if(editing&&editing.kind==="rule"){renderRuleEditor();return;}
  const words=ruleWords();
  const criteriaText=r=>(r.criteria||[]).map(c=>

  const actionsText=r=>(r.actions||[]).map(a=>{

      const detail=params.length?params.join(", "):(a.value||"");

  const rows=cache.rules.map(r=>`

        <td>${r.active?'<span class="badge good">On</span>':'<span class="badge warn">Off</span>'}</td>

  $("#content").innerHTML=`<div class="view">
    <div class="card flat">
      <p class="note">${escHtml(operation("/api/v1/rules","get").description||"")}</p>
      <div class="tablewrap"><table><thead><tr><th>Rule</th><th>Active</th><th>When</th><th>Then</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="empty">No global rules are defined.</td></tr>'}</tbody></table></div>
      <div class="row" style="margin-top:16px"><button class="btn" data-act="rulenew">New rule</button></div>
    </div></div>`;

      <select data-r="crit-match" data-i="${i}">${optionsHtml(words.matches,c.match)}</select>
      <input data-r="crit-value" data-i="${i}" placeholder="Value" value="${escHtml(c.value||"")}" style="flex:1;min-width:200px">
      <button class="btn ghost sm" data-act="critdel" data-i="${i}">Remove</button>
    </div>`).join("")||'<div class="note">No criteria: the rule matches every message.</div>';
  const actions=d.actions.map((a,i)=>{
    const params=words.actions[a.type]||[];
    const controls=params.map(p=>{
      const value=a[p]!==undefined?a[p]:(params.length===1?(a.value||""):"");
      if(p==="route_id")
        return '<select data-r="act-'+p+'" data-i="'+i+'">'+optionsHtml(routeChoices,value)+'</select>';
      if(p==="body")
        return '<textarea data-r="act-'+p+'" data-i="'+i+'" rows="3" placeholder="Body" style="flex:1;min-width:240px">'+escHtml(value)+'</textarea>';
      return '<input data-r="act-'+p+'" data-i="'+i+'" placeholder="'+escHtml(humanise(p))+'" value="'+escHtml(value)+'" style="flex:1;min-width:170px">';
    }).join("")||'<span class="muted" style="font-size:12.5px">This action takes no parameters.</span>';
    return `<div class="row erow">
      <select data-r="act-type" data-i="${i}">${optionsHtml(words.types,a.type)}</select>
      ${controls}
      <button class="btn ghost sm" data-act="actdel" data-i="${i}">Remove</button>
    </div>`;
  }).join("")||'<div class="note">No actions: the rule does nothing.</div>';
  $("#content").innerHTML=`<div class="view">
    <button class="btn ghost sm" data-act="cancel">‹ All rules</button>
    <div class="sect"><h2>${editing.id?"Edit rule "+escHtml(editing.id):"New rule"}</h2>
      <div class="card flat">
        <div class="row">
          <input id="ruleName" placeholder="Rule name" value="${escHtml(d.name||"")}" style="flex:1;min-width:240px">
          <label class="row" style="gap:7px"><input type="checkbox" id="ruleActive"${d.active?" checked":""}> Active</label>
          <select id="ruleAll">${optionsHtml([{value:"all",label:"Every criterion must match"},{value:"any",label:"Any one criterion matches"}],d.all_criteria?"all":"any")}</select>
        </div>
      </div>
    </div>
    <div class="sect"><h2>When</h2><div class="card flat">${criteria}
      <div class="row" style="margin-top:14px"><button class="btn ghost sm" data-act="critadd">Add criterion</button></div></div></div>
    <div class="sect"><h2>Then</h2><div class="card flat">${actions}
      <div class="row" style="margin-top:14px"><button class="btn ghost sm" data-act="actadd">Add action</button></div></div></div>
    <div class="sect"><div class="row">
      <button class="btn" data-act="rulesave">Save rule</button>
      <button class="btn ghost" data-act="cancel">Cancel</button>
      <div class="err" id="err_ruleedit"></div>
    </div></div>
  </div>`;
}
function readRuleForm(){
  const d=editing.rule;
  d.name=$("#ruleName").value;
  d.active=$("#ruleActive").checked;
  d.all_criteria=$("#ruleAll").value==="all";
  document.querySelectorAll("#content [data-r]").forEach(el=>{
    const i=Number(el.dataset.i), r=el.dataset.r;
    if(r.indexOf("crit-")===0){if(d.criteria[i])d.criteria[i][r.slice(5)]=el.value;}
    else if(r.indexOf("act-")===0){if(d.actions[i])d.actions[i][r.slice(4)]=el.value;}
  });
}
async function saveRule(){
  readRuleForm();
  setErr("err_ruleedit","");
  const words=ruleWords(), d=editing.rule;
  const body={
    name:d.name,active:!!d.active,all_criteria:!!d.all_criteria,
    criteria:d.criteria.map(c=>{
      const o={field:c.field,match:c.match,value:c.value||""};
      if(c.field==="header")o.header=c.header||"";
      return o;
    }),
    // Only the parameters that carry something: the create refuses a parameter
    // its action does not take, and an omitted optional one is simply empty.
    actions:d.actions.map(a=>{
      const o={type:a.type};
      (words.actions[a.type]||[]).forEach(p=>{
        const v=a[p];
        if(v===undefined||v===""||v===null)return;
        o[p]=(p==="route_id")?Number(v):v;
      });
      return o;
    })
  };
  try{
    if(editing.id)await api("/api/v1/rules/"+editing.id,{method:"PUT",body:JSON.stringify(body)});
    else await api("/api/v1/rules",{method:"POST",body:JSON.stringify(body)});
    editing=null;toast("Rule saved");await render();
  }catch(e){
    if(e.message==="auth"){signedOut("The session ended. Sign in again.");return;}
    setErr("err_ruleedit",e.message);
  }
}

/* ---------- Ports ----------
   The listeners are built when the server starts, so this view says what the
   document says about that and carries the button that restarts the services in
   place (POST /api/v1/server/reinitialize). That restart also ends every browser
   session, this one included, so the page returns to the sign-in card. */
async function renderPorts(){
  await loadSpec();
  cache.ports=asList(await api("/api/v1/ports"),"ports");
  cache.certificates=asList(await api("/api/v1/certificates"),"certificates");
  if(editing&&editing.kind==="port"){renderPortEditor();return;}
  const certName=id=>{
    const c=cache.certificates.filter(x=>Number(x.id)===Number(id))[0];
    return c?c.name:(Number(id)?"id "+id:"—");
  };
  const rows=cache.ports.map(p=>`
    <tr><td><b>${escHtml(humanise(p.protocol))}</b><div class="hint muted">id ${escHtml(p.id)}</div></td>
        <td><code>${escHtml(p.address)}:${escHtml(p.port)}</code></td>
        <td>${escHtml(humanise(p.connection_security))}</td>
        <td>${escHtml(certName(p.certificate_id))}</td>
        <td>${escHtml(humanise(p.client_certificate_policy))}${p.client_certificate_ca_file?'<div class="hint muted">'+escHtml(p.client_certificate_ca_file)+'</div>':""}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ghost sm" data-act="portedit" data-id="${escHtml(p.id)}">Edit</button>
          <button class="btn danger sm" data-act="portdel" data-id="${escHtml(p.id)}" data-label="${escHtml(p.protocol+" "+p.address+":"+p.port)}">Delete</button>
          <div class="err" id="err_port_${escHtml(p.id)}"></div></td></tr>`).join("");
  const restartWording=[
    sentencesWith(operation("/api/v1/ports","post").description,"restart"),
    sentencesWith(operation("/api/v1/ports/{id}","put").description,"restart"),
    sentencesWith(operation("/api/v1/ports/{id}","delete").description,"restart")
  ].filter(Boolean).join(" ");
  $("#content").innerHTML=`<div class="view">
    <div class="card flat">
      <p class="note">${escHtml(operation("/api/v1/ports","get").description||"")}</p>
      <p class="note"><span class="badge warn">restart</span> ${escHtml(restartWording)}</p>
      <div class="tablewrap"><table><thead><tr><th>Protocol</th><th>Listens on</th><th>Security</th><th>Certificate</th><th>Client certificate</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="empty">No listeners are configured.</td></tr>'}</tbody></table></div>
      <div class="row" style="margin-top:16px">
        <button class="btn" data-act="portnew">Add a port</button>
        <button class="btn ghost" data-act="portapply">Restart the services now</button>
        <div class="err" id="err_portapply"></div>
      </div>
      <p class="note" style="margin-top:12px">${escHtml(operation("/api/v1/server/reinitialize","post").description||"")}</p>
    </div></div>`;
}

  try{

    else await api("/api/v1/ports",{method:"POST",body:JSON.stringify(body)});

  if(!confirm("Delete the listener "+label+"?"))return;
  setErr("err_port_"+id,"");
  try{await api("/api/v1/ports/"+id,{method:"DELETE"});toast("Port deleted");await render();}

async function applyRestart(){
  setErr("err_portapply","");
  if(!confirm("Restart the server's services now? Connections in progress are dropped, and this browser session ends with them."))return;
  try{await api("/api/v1/server/reinitialize",{method:"POST"});}
  catch(e){if(e.message==="auth"){signedOut("The session ended. Sign in again.");return;}setErr("err_portapply",e.message);return;}
  toast("Restarting the services…");
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  // The listener stops and starts with the rest of the services, and it drops
  // every browser session as it goes, so what is waited for is this page coming
  // back at all - asked for without a credential, because a request the server
  // answers 401 is a request that puts the browser's own password box on the
  // screen. When it answers, the session this page held is gone with the
  // listener that held it, and the sign-in card says so.
  for(let attempt=0;attempt<60;attempt++){
    await new Promise(r=>setTimeout(r,1000));
    let res=null;
    try{res=await fetch("/",{credentials:"omit",cache:"no-store"});}catch(_){continue;}
    if(res.status===200){signedOut("The services restarted, which ended this session. Sign in again.");return;}
  }
  signedOut("The server did not answer after the restart. Sign in again when it is back.");
}

function fmtBytes(n){n=Number(n)||0;if(n>=1048576)return (n/1048576).toFixed(1)+" MB";if(n>=1024)return (n/1024).toFixed(1)+" KB";return n+" B";}
async function showLog(name,lines){
  setErr("err_log","");
  try{
    const t=await api("/api/v1/logs/"+encodeURIComponent(name)+"?lines="+encodeURIComponent(lines||200));
    const pre=$("#logPre");if(!pre)return;
    pre.hidden=false;
    pre.textContent=(t.lines||[]).join("\n")||"(empty)";
    pre.scrollTop=pre.scrollHeight;
  }catch(e){if(e.message==="auth"){signedOut("The session ended. Sign in again.");return;}setErr("err_log","Could not read "+name+": "+e.message);}
}

/* ---------- Boot ----------
   No credential is stored, so the only question at load is whether the browser
   still holds a live session cookie - and that is asked only when this tab has
   signed in before. Asking unconditionally would mean a request answered 401 on
   every first visit, and a 401 from this API carries WWW-Authenticate: Basic,
   which is the browser's cue to put its own password box on the screen in front
   of the page's. */
let resumed=false;
try{resumed=sessionStorage.getItem("hmsSession")==="1";}catch(_){}
if(resumed)api("/api/v1/status").then(enter).catch(()=>{signedOut("The session ended. Sign in again.");});
</script>
