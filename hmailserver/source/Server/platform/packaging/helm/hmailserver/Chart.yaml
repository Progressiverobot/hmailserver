apiVersion: v2
name: hmailserver
description: >-
  hMailServer - SMTP, IMAP and POP3 with a REST API, the Control Deck and the webmail
  on one listener - as a StatefulSet beside the PostgreSQL or MariaDB it keeps its
  data in. The database is not in the chart: point database.host at one.
type: application
version: 0.1.0
# The application this chart installs, by tag rather than by number: a version
# spelled out here would be one more place to stamp at a release and one more
# to forget, which is what build/check-linux-version-stamp.sh refuses. It is
# the default image tag (values.yaml, image.tag), so the chart installs the
# current stable release unless a version is asked for.
appVersion: "latest"
home: https://github.com/Progressiverobot/hmailserver
sources:
  - https://github.com/Progressiverobot/hmailserver
keywords:
  - mail
  - smtp
  - imap
  - pop3
maintainers:
  - name: Progressive Robot Ltd
    url: https://www.progressiverobot.com
