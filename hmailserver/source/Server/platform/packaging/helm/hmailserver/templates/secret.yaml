#
# The two secrets the server needs, from the values - unless existingSecret
# names one you made, in which case nothing is written here.
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hmailserver.fullname" . }}
  labels:
    {{- include "hmailserver.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKeys.databasePassword }}: {{ required "database.password is required (or set existingSecret)" .Values.database.password | quote }}
  {{ .Values.existingSecretKeys.administratorPassword }}: {{ required "administrator.password is required (or set existingSecret)" .Values.administrator.password | quote }}
{{- end }}
