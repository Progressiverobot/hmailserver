;
; The packaged default configuration, installed as /etc/hmailserver/hMailServer.ini.
;
; The server looks for hMailServer.ini beside its own executable first and falls
; back to this path, so a package installation finds this file with no argument
; and a build tree finds its own. --config <file> overrides both.
;
; Only ';' starts a comment, and only at the start of a line. Text after a value
; on the same line is part of the value, exactly as on Win32 - so every note here
; is on a line of its own.
;
; The file is UTF-8 without a byte order mark. Comments, blank lines and key order
; all survive a write by the server, so an edited file stays an edited file.
;
; After editing, check it before starting anything:
;
;     hmailserver --check-config
;
; It reads the file, prints the four directories and the database type it made of
; them, and exits without opening a listener or the database.

[Directories]

; The read-only part of the installation. DBScripts and Languages are looked for
; underneath it, which is why it points at the package's data directory rather
; than at /usr/bin: the executable is one file and everything it reads is here.
ProgramFolder=/usr/share/hmailserver

; The mail store. Every domain is a directory under this one and every message is
; a file, so this is the path that grows and the one to put on the volume with
; the space. Nothing else in the installation needs backing up as urgently.
DataFolder=/var/lib/hmailserver

; The server writes hmailserver_<date>.log and ERROR_hmailserver_<date>.log here,
; a new pair each day. See /etc/logrotate.d/hmailserver for what happens to them
; afterwards, and LogDeleteDays below for the server's own alternative.
LogFolder=/var/log/hmailserver

; Scratch space, on the same volume as the store on purpose: a virus scanner
; writes the message here before handing the path to an external scanner, and a
; backup stages and verifies its archive here, so it wants to be large and it
; wants to be fast. The systemd unit sets PrivateTmp=yes, which does not affect
; this path - the server does not use /tmp.
TempFolder=/var/lib/hmailserver/temp

; Where the event scripts live (EventHandlers.vbs and its kin). The script engine
; is the Windows scripting host, which this build does not have, so the directory
; is created and stays empty here. It is still configured because the server
; reads the key at startup regardless.
EventFolder=/var/lib/hmailserver/events

; Only the two Windows-only backends put anything here - SQL Server Compact keeps
; its database file in this directory, and the bundled MySQL its data files. This
; build has neither, so the directory exists and stays empty. The key is one of
; the six the server reads and is set for that reason.
DatabaseFolder=/var/lib/hmailserver/database

[Database]

; NOT CONFIGURED. This is the one section a package cannot fill in, and the
; server will refuse to start until somebody does: an empty Type is
; TypeUnknown, GetDatabaseSettingsExists() answers false, and the startup says so
; rather than half-starting.
;
; Two backends work on this platform:
;
;   Type=PostgreSQL   reached through libpq, which the package depends on
;   Type=MySQL        reached through libmariadb.so.3, loaded at run time with
;                     dlopen - so the client package must be installed
;                     separately (libmariadb3 on Debian and Ubuntu,
;                     mariadb-connector-c on Fedora and RHEL, mariadb-libs on
;                     Arch). It is not a link-time dependency and no package
;                     manager will pull it in for you.
;
; MSSQL and MSSQLCE are refused by name with an explanation in the error log:
; both are reached through Windows-only interfaces. An INI carried across from a
; Windows installation is repointed here or it does not start.
;
; The schema is not created for you either. See the packaging README for the
; exact psql and mysql commands; the scripts are in /usr/share/hmailserver/DBScripts.
Type=

; The host the database is on, and the name of the database on it. Server must be
; set for every backend - a missing one is the specific error --check-config and
; the startup report. "localhost" is a fine answer.
Server=
Database=

Username=
Password=

; How Password above is stored. 0 is plain text, which is what an administrator
; typing into this file writes, and is why the file is mode 0640 and owned by
; root rather than by the service. The Windows Control Panel writes 1 (Blowfish)
; or 6, and 6 means the platform's secret store: DPAPI on Windows, and here the
; key file described under ProtectStoredSecretsWithDPAPI below. A 6 written by a
; Windows machine is a DPAPI blob, which nothing on this platform can open; it is
; recognised as one and reported (HM6414), and the password has to be re-entered
; here in plain text. Nothing on this platform rewrites this value - the code that
; would is the COM administration API - so 0 is this file's normal state.
Passwordencryption=0

; The port on that host. It has no default worth relying on: the value is put
; into the connection string as it stands, so PostgreSQL wants 5432 and
; MySQL/MariaDB wants 3306 written out. MySQL alone falls back to 3306 when this
; is 0; PostgreSQL would try to connect to port 0.
Port=0

; 0 = an ordinary database server, which is the only kind this build talks to.
; The internal database is a MySQL server the Windows installer bundles and
; supervises; there is none here.
Internal=0

; TLS to the database. libpq's own default is "prefer", which encrypts when the
; server offers it and verifies nothing. Set "require" at least, and "verify-full"
; with PostgreSQLSslRootCert pointing at the CA when the database is on another
; host. A mode this server does not recognise refuses the connection and says so,
; rather than falling back to the default.
;PostgreSQLSslMode=verify-full
;PostgreSQLSslRootCert=/etc/ssl/certs/ca-certificates.crt

[Security]

; The administrator credential. It gates the REST API - which refuses to start
; without one - and it is the only administration surface this build has, since
; the COM API is Windows-only.
;
; Set it to the password itself. Nothing on this platform hashes it for you: the
; server recognises a stored PBKDF2, Argon2id, scrypt, SHA256 or MD5 hash by its
; shape and compares anything else literally, and the code that rewrites a typed
; password as a PBKDF2 hash is reached only through the COM API. That is the
; reason this file is 0640 root:hmailserver - the service reads it and cannot
; rewrite it, and no other account on the machine can read it at all.
;
; An empty value means no administrator authentication is configured; the REST
; API will not start at all in that state, which is the intended default for a
; package that has just been unpacked.
AdministratorPassword=

[Settings]

; The passwords this server has to present to somebody else - route and
; fetch-account passwords, per-domain relay passwords, private-key passphrases,
; the administrator's TOTP secret - cannot be hashed, so they are encrypted at
; rest. The key is named for the Windows store (DPAPI) and kept for
; compatibility; on this platform 1 means a key file:
;
;   /var/lib/hmailserver/.hmailserver-secret-key
;
; 32 random bytes, made by the server with mode 0600 the first time a secret is
; stored, and never rewritten. Each secret is AES-256-GCM under that key with a
; nonce of its own, and is stored as LINUX1:<base64> so the value says which
; store wrote it. The file is refused, with the chmod that fixes it, if any
; account but its owner can read it.
;
; Two consequences follow from the key being a file. Back it up WITH the
; database - a database restored without it has lost every stored password, and
; the error log names the file when that happens. And it travels: copy the data
; directory and the database together and every stored password opens on the
; new machine, which the Windows store cannot offer.
;
; If the key file cannot be made or read, the secret is NOT stored and an error
; says why (HM6410-HM6413, HM6416); this build never falls back to the fixed-key
; Blowfish scheme on its own. 0 selects that scheme deliberately, which is a
; choice of "portable and protected from nobody who has the binary".
ProtectStoredSecretsWithDPAPI=1

; The REST API, which on this platform is the administration interface: there is
; no Control Panel and no COM. 0 leaves it off. 8080 or similar turns it on, and
; it will not start until AdministratorPassword above is set.
;
; TLS is required unless the bind address is exactly 127.0.0.1, localhost or ::1.
; Reach a loopback-bound API from elsewhere with an SSH tunnel, or set the
; certificate and key files and bind an address.
RestApiPort=0
RestApiBindAddress=127.0.0.1
;RestApiCertificateFile=/etc/hmailserver/rest.pem
;RestApiPrivateKeyFile=/etc/hmailserver/rest.key

; Operational events - the database going away, a listener that could not bind, a
; failed backup, the disk floor - go to syslog on this platform, under the
; identity "hmailserver", and so reach the journal and anything reading it. The
; key is named for the Windows event log it writes to there; it is the same list
; of events and the same throttle. A healthy server writes none of them.
WindowsEventLogEnabled=1

; 1=Critical, 2=+High, 3=+Medium, 4=everything the error manager reports. Protocol
; chatter never goes to syslog whatever this says.
WindowsEventLogLevel=2

; The server can prune its own date-stamped logs; 0 leaves them alone. Leave it at
; 0 while /etc/logrotate.d/hmailserver is in place, because two things deleting
; the same files by two different rules is how a retention policy stops meaning
; anything. Set this and remove the logrotate rule if you would rather the server
; owned it.
LogDeleteDays=0

; How long a stop waits for sessions in flight to finish. 0 stops immediately,
; which drops a delivery mid-DATA and leaves the sender to retry. If you raise it,
; raise TimeoutStopSec in the systemd unit to match - systemd kills the process
; when its own timeout expires, whatever the server was waiting for.
ShutdownDrainSeconds=0

; One combined log, which is what makes the logrotate glob and any journal-shaped
; reader simplest. 1 splits SMTP, POP3 and IMAP into files of their own.
SepSvcLogs=0

; Free space on the message-store volume, in megabytes, below which mail is
; refused with a temporary error instead of being accepted and possibly lost. The
; warning threshold is where you are told, well before the floor is reached. Both
; are absolute rather than proportional, because what decides whether the next
; message fits is bytes and not percentages.
MinimumFreeDiskSpaceMB=100
DiskSpaceWarningThresholdMB=1024
