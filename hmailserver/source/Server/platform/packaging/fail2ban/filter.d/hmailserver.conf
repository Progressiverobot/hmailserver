#
# Fail2Ban filter for hMailServer.
#
# hMailServer counts failed logons per address across every protocol that
# authenticates - SMTP AUTH, POP3, IMAP, ManageSieve and the REST API - and writes
# one line per counted failure to its application log, in a fixed shape that does
# not depend on protocol logging being on:
#
#   "APPLICATION"	1234	"2026-09-11 03:12:44.117"	"Auto-ban: logon failure 2 of 5 from 203.0.113.9 for alice@example.com"
#   "APPLICATION"	1234	"2026-09-11 03:12:51.502"	"Auto-ban: 203.0.113.9 is banned for 60 minutes after 5 failed logons; last user name alice@example.com"
#
# The fields are tab-separated and quoted. The first line is what this filter
# counts; the second is matched too, so that an address the server has already
# banned is banned here as well, for fail2ban's own bantime, on every port in the
# jail. AutoBanLogonEnabled must be on in the server (it is, as shipped) for the
# lines to be written at all.

[INCLUDES]

before = common.conf

[Definition]

_daemon = hmailserver

failregex = ^(?:"APPLICATION"\t\d+\t*)?"Auto-ban: logon failure \d+ of \d+ from <HOST> for [^"]*"\s*$
            ^(?:"APPLICATION"\t\d+\t*)?"Auto-ban: <HOST> is banned for \d+ minutes after \d+ failed logons[^"]*"\s*$

ignoreregex =

# The timestamp is the third field, quoted, to the millisecond. Fail2Ban cuts
# what this matches out of the line before failregex sees it, which is why the
# expressions above have no date field and tolerate the tabs it leaves behind.
datepattern = "%%Y-%%m-%%d %%H:%%M:%%S(?:\.%%f)?"

[Init]

journalmatch =
