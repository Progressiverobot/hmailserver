#
# Fail2Ban jail for hMailServer. Installed by the package; off until you turn it
# on, as Debian's policy for shipped jails asks:
#
#    printf '[hmailserver]\nenabled = true\n' > /etc/fail2ban/jail.d/hmailserver.local
#    systemctl reload fail2ban
#    fail2ban-client status hmailserver
#
# The filter (filter.d/hmailserver.conf) reads the server's application log,
# which is /var/log/hmailserver/hmailserver_<date>.log, one file a day. The
# server's own auto-ban still applies inside the server; this jail is what puts
# the address into the kernel's firewall as well, on every mail port, for
# bantime, without the service needing CAP_NET_ADMIN. If you also set
# AutoBanFirewall=1 in hMailServer.ini the two do not conflict - nftables and
# iptables both accept the same address from two places - but one of them is
# enough.

[hmailserver]
enabled  = false
port     = smtp,submission,submissions,pop3,pop3s,imap,imaps,sieve
filter   = hmailserver
logpath  = /var/log/hmailserver/hmailserver_*.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 1h
